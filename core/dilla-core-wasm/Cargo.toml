[package]
name = "dilla-core-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false

# Rust 1.98 emits these standardized wasm instructions. wasm-pack 0.15's bundled
# wasm-opt 117 needs both enabled when validating the custom profile.
[package.metadata.wasm-pack.profile.custom]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lib]
crate-type = ["cdylib", "rlib"]      # wasm-pack requires cdylib on the crate it is given

[features]
test-hooks = ["dilla-core/test-hooks"]
# The vector runner (and the six minified vector JSON files it embeds) is conformance, not product:
# the browser build leaves it out. CI runs the tests with `--features vectors`.
vectors = ["dilla-core/vectors"]

[dependencies]
dilla-core = { path = "../dilla-core" }
wasm-bindgen         = "0.2.128"
wasm-bindgen-futures = "0.4.54"
js-sys               = "0.3.81"
web-sys  = { version = "0.3.81", features = [
  "StorageManager", "FileSystemSyncAccessHandle", "FileSystemDirectoryHandle",
  "FileSystemGetDirectoryOptions", "FileSystemReadWriteOptions", "WorkerGlobalScope",
  "WorkerNavigator", "FileSystemGetFileOptions", "FileSystemFileHandle",
  "DedicatedWorkerGlobalScope", "Navigator", "Lock", "LockManager",
] }
serde_json = "1.0.151"
console_error_panic_hook = "0.1"
# Deviation A2-14: StoreHandle keeps the 256-bit device KEK for the lifetime of the handle so that
# resume() can replay PRAGMA key, and builds a pragma string containing it on every open and resume.
# Zeroizing is what keeps both out of freed wasm linear memory.
zeroize = { version = "1", features = ["zeroize_derive"] }

# Deviation A2-2. Pins copied verbatim from interfaces §3.1's wasm block. rusqlite keeps its default
# features: dropping them removes the `ffi-sqlite-wasm-rs` backend entirely (gap-12 T1). The direct
# `sqlite3mc` feature on sqlite-wasm-rs is what unifies encryption into rusqlite's single copy; drop
# this dependency and encryption silently disappears (gap-11 §9 item 2). sqlite-wasm-rs 0.6 enables
# nothing by default: `wasm-bindgen` is what provides `WasmOsCallback` (randomness, clock, entropy).
# sqlite-wasm-vfs 0.3 gates the OPFS pool behind its `sahpool` feature.
# RUSTSEC-2026-0459: sqlite-wasm-rs 0.6.3 compiles SQLite3MC 2.6.1 on SQLite 3.54.0 (sqlite3mc-src
# =206.1.0); 0.6.2 and older bundle SQLite < 3.54 (core/vendor/README.md has the history).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
rusqlite        = { version = "0.41.1" }
sqlite-wasm-rs  = { version = "0.6.3", default-features = false, features = ["sqlite3mc", "wasm-bindgen"] }
sqlite-wasm-vfs = { version = "0.3.0", features = ["sahpool"] }
# Task 3's MLS probe and task 7's facade use the versions dilla-core already resolves.
openmls                  = { version = "=0.9.0", default-features = false, features = ["js"] }
openmls_basic_credential = "=0.6.0"

[dev-dependencies]
wasm-bindgen-test = "0.3.78"

[lints]
workspace = true
