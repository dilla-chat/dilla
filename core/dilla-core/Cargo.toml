[package]
name = "dilla-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false

[lib]
crate-type = ["rlib"]

[features]
test-hooks = []
default = []
vectors = ["dep:serde_json"]
# Test hooks the dilla-testkit drives and no client may ship: DillaGroup::requeue_member_removes_last.
testkit = []

[dependencies]
base64 = "0.23"
# MLS - the workspace patch pins all OpenMLS crates to one upstream revision with the
# RustCrypto migration. Keep the sibling crate versions exact to match their trait surface.
# The wasm targets still require OpenMLS's `js` feature for `web_time`.
openmls                  = { version = "=0.9.0", default-features = false }
openmls_traits           = "=0.6.0"
openmls_rust_crypto      = "=0.6.0"
openmls_basic_credential = "=0.6.0"
tls_codec                = { version = "=0.5.0", features = ["derive", "serde", "mls"] }
# Sealed Bot commands (RFC 9180 base mode). Pinned to exactly the versions openmls_rust_crypto
# already locks, so these add no crate to Cargo.lock; the core uses the RustCrypto provider.
hpke-rs             = { version = "=0.8.0", default-features = false }
hpke-rs-crypto      = "=0.8.0"
hpke-rs-rust-crypto = "=0.8.0"
# Match the patched upstream OpenMLS cryptography generation.
ed25519-dalek = { version = "3.0", default-features = false, features = ["zeroize"] }
sha2          = "0.11"
hmac          = "0.13"
hkdf          = "0.13"
aes-gcm       = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
# serde codec for the OpenMLS StorageProvider blobs ONLY (deviation A1-5, gap-6 section 4).
# Never used to decode a normative dilla format: those go through crate::cbor.
ciborium   = { version = "0.2.2", default-features = false, features = ["std"] }
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }     # feature `vectors` only
thiserror  = "2.0"
zeroize    = { version = "1", features = ["zeroize_derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# rusqlite's default features include `ffi-sqlite-wasm-rs`; dropping them breaks the wasm FFI
# backend entirely (gap-12 T1). Keep defaults, and add `sqlite3mc` on sqlite-wasm-rs so feature
# unification compiles the encrypting amalgamation into rusqlite's single copy. 0.6.3 is the first
# release on SQLite >= 3.54 (RUSTSEC-2026-0459); `wasm-bindgen` provides `WasmOsCallback`.
rusqlite        = { version = "0.41.1" }
sqlite-wasm-rs  = { version = "0.6.3", default-features = false, features = ["sqlite3mc", "wasm-bindgen"] }
sqlite-wasm-vfs = { version = "0.3.0", features = ["sahpool"] }
getrandom_02    = { package = "getrandom", version = "0.2.17", features = ["js"] }
getrandom_04    = { package = "getrandom", version = "0.4.3",  features = ["wasm_js"] }
openmls         = { version = "=0.9.0", default-features = false, features = ["js"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "wasi"))'.dependencies]
# openmls 0.9.0 gates `use web_time::SystemTime` on `target_arch = "wasm32"`, but declares
# `web-time` as an OPTIONAL, un-target-gated dependency that only the `js` feature turns on.
# So wasip1 needs `js` purely to make `web_time` resolve - a compile-time requirement, not a
# runtime one (gap-2 section 2, correction 2; E0432 in four files without it). web-time is cfg
# `all(target_family = "wasm", target_os = "unknown")`, so on wasi it re-exports `std::time` and
# the clock is the real WASI `clock_time_get` that wazero serves (facts-wazero section 6).
# `js` also turns on `getrandom/wasm_js`, whose backend is cfg-gated to target_os unknown/none;
# on wasi getrandom keeps its `random_get` backend.
openmls = { version = "=0.9.0", default-features = false, features = ["js"] }

[dev-dependencies]
serde_json = "1.0.151"
hex        = "0.4"
# Deviation A1-13: interfaces section 3.1 lists only serde_json and hex. Plan section 6's task-9
# test list requires a trybuild compile-fail test (tests/coherence.rs), which needs this crate.
# Dev-only, host-only: tests/coherence.rs carries #![cfg(not(target_arch = "wasm32"))].
trybuild   = "1.0"

# `tests/vectors_wasm.rs` only. Same 0.3.78 the `dilla-core-wasm` crate pins (the pair for
# wasm-bindgen 0.2.128, gap-30 section 1.1), and target-gated for the same reason every other wasm
# entry in this manifest is: the native and wasip1 test builds must not acquire it.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3.78"

[lints]
workspace = true
