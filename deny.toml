[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
           "wasm32-unknown-unknown", "wasm32-wasip1"]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# Every entry here must be a licence the resolved graph actually carries: cargo-deny reports an
# unused allowance as `license-not-encountered`, and a run that prints warnings is a run whose
# warnings stop being read. `ISC` was dropped for exactly that reason (nothing in the graph over
# the four targets in [graph] carries it); `BlueOak-1.0.0` went the same way with minicbor
# (deviation A1-3). Add one back when the dependency that needs it arrives, not before.
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0",
         "Zlib", "MPL-2.0"]
confidence-threshold = 0.9

# sqlcipher-src carries the SQLCipher amalgamation the native store is built from (build-dependency
# of the patched libsqlite3-sys, core/vendor/README.md): SQLite's public-domain blessing and
# libtomcrypt's WTFPL-style licence. Scoped to that one crate so nothing else may use either.
[[licenses.exceptions]]
crate = "sqlcipher-src"
allow = ["blessing", "WTFPL"]

# sqlite3mc-src carries the SQLite3 Multiple Ciphers amalgamation the browser store is built from
# (build-dependency of sqlite-wasm-rs 0.6): SQLite's public-domain dedication as CC0-1.0, and the
# Unlicense / CC0-1.0 parts of the bundled cipher sources. Scoped to that one crate.
[[licenses.exceptions]]
crate = "sqlite3mc-src"
allow = ["CC0-1.0", "Unlicense"]

[licenses.private]
ignore = true                      # every dilla crate is publish = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
# The four dilla crates depend on each other by `path` with no version requirement, which the
# wildcards check reports. That is only a hazard for a crate that is published; every dilla crate
# is `publish = false`, which is exactly the case this key exempts.
allow-wildcard-paths = true

[[bans.skip]]
crate = "rand_core"
reason = "rand_chacha 0.3 (deterministic testkit fixtures) needs 0.6, while the upstream OpenMLS crypto provider and rand 0.10 use 0.10."

[[bans.skip]]
crate = "rand_chacha"
reason = "testkit uses 0.3 for deterministic fixtures; upstream OpenMLS and rand 0.10 use 0.10. Collapses when the fixtures can migrate without changing vectors."

[[bans.skip]]
crate = "getrandom"
reason = "getrandom 0.2 serves testkit's rand_core 0.6 fixtures, while 0.4 serves rand_core 0.10. Collapses with the fixture RNG migration."

# The remaining duplicates are confined to fixture RNGs and proc macros. Keep these exceptions narrow so crypto duplicates fail the check.

[[bans.skip]]
crate = "syn"
reason = "2.0.119 is what nearly every proc macro still uses; wasm-bindgen-test-macro 0.3.78 has moved to 3.0.6. Build-time only; collapses as the ecosystem finishes the syn 3 migration."

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/openmls/openmls"]
