[workspace]
resolver = "3"
members = [
    "core/dilla-core",
    "core/dilla-bot-core",
    "core/dilla-core-wasm",
    "core/dilla-core-wasi",
    "testkit",
    "clients/desktop/dilla-client",
    "clients/desktop/dilla-media",
    "clients/desktop/dilla-desktop-ui",
    "clients/desktop/dilla-desktop",
    "clients/desktop/parity",
]
default-members = ["core/dilla-core", "testkit"]
# Third-party source carried with a patch (core/vendor/README.md): never a member, so fmt, clippy and
# the workspace lints leave the upstream code as it was published.
# experiments/gpui-*: the GPUI proofs are standalone workspaces of their own.
exclude = ["core/vendor", "experiments/gpui-*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/dilla-chat/dilla"

[workspace.lints.rust]
unsafe_code = "warn"          # dilla-core forbids it outright; the wasi crate opts back in

[profile.release]
lto = "thin"
codegen-units = 1

# C16 / web-1 ruling 23: the browser core. wasm-pack selects it with --profile wasm-release.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = true

[patch.crates-io]
# RUSTSEC-2026-0459 (SQLite < 3.54, crafted -wal file): libsqlite3-sys 0.39.1 with only its
# sqlcipher-src pin moved from =419.0.6 (SQLite 3.53.4) to =420.0.0 (SQLite 3.54.1), so the native
# SQLCipher store is built on a fixed SQLite (core/vendor/README.md). Remove once
# upstream libsqlite3-sys ships with sqlcipher-src >= 420.
libsqlite3-sys = { path = "core/vendor/libsqlite3-sys" }
# OpenMLS 0.9.0's published RustCrypto crates still pull crypto-bigint 0.5.5
# (RUSTSEC-2026-0387). Pin the upstream crypto migration until it is released.
openmls = { git = "https://github.com/openmls/openmls", rev = "e0b21a70a55a9014b8de2772b36bf3d638adad51" }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "e0b21a70a55a9014b8de2772b36bf3d638adad51" }
openmls_memory_storage = { git = "https://github.com/openmls/openmls", rev = "e0b21a70a55a9014b8de2772b36bf3d638adad51" }
openmls_serialization_helpers = { git = "https://github.com/openmls/openmls", rev = "e0b21a70a55a9014b8de2772b36bf3d638adad51" }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", rev = "e0b21a70a55a9014b8de2772b36bf3d638adad51" }
openmls_basic_credential = { git = "https://github.com/openmls/openmls", rev = "e0b21a70a55a9014b8de2772b36bf3d638adad51" }
