[package]
name = "dilla-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Test-only automation interface (src/automation.rs): a headless window driven over stdin/stdout, with
# screenshots. It needs GPUI's test-support renderer, so release builds never enable it.
automation = ["dep:image", "dep:serde", "dep:serde_json", "gpui/test-support", "gpui-platform/test-support"]

[dependencies]
dilla-client = { path = "../dilla-client" }
dilla-media = { path = "../dilla-media" }
dilla-desktop-ui = { path = "../dilla-desktop-ui" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12" }
# The composer and the sign-in fields (Task 4's proof: Textarea with submit_on_enter).
gpui-component = "=0.9.1"
# The client's state channel (a watch) and the sign-in steps' runtime. Already in the lock.
tokio = { version = "1", features = ["sync", "rt"] }
url = "2"
zeroize = "1"
# Message times in the local zone (already in the lock through gpui-component).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
# The automation build's channel-view fixture (src/fixture.rs).
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }

# On Linux the platform's windowing and its text system come with a display backend: without one `current_platform`
# has no text system (the headless frame draws no glyphs, Task 3's finding) and no window opens. Wayland only: the X11
# backend pulls zed-xim -> ahash -> const-random-macro (CC0-1.0), which the licence allow-list rejects.
[target.'cfg(target_os = "linux")'.dependencies]
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["wayland"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
# The slice test and the parity world (tests/support/world.rs) run a real dillad and headless clients, made the way
# dilla-client's sync tests make them. All already in the lock.
dilla-core = { path = "../../../core/dilla-core" }
dilla-testkit = { path = "../../../testkit" }
dilla-parity = { path = "../parity" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1.0.151"
url = "2"
hmac = "0.13"
sha1 = "0.11"
