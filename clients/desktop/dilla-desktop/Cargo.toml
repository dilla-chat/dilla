[package]
name = "dilla-desktop"
version = "0.2.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Test-only automation interface (src/automation.rs): a headless window driven over stdin/stdout, with
# screenshots. It needs GPUI's test-support renderer, so release builds never enable it.
automation = ["test-hooks", "dilla-client/testing", "gpui/test-support", "gpui-platform/test-support"]
# The AppView hooks the tests drive (review M6: `forget_from_forced` signs out and wipes, so release builds do not have
# it). The crate's own tests turn it on through the dev-dependency on itself below.
test-hooks = []

[dependencies]
dilla-client = { path = "../dilla-client" }
dilla-media = { path = "../dilla-media" }
dilla-desktop-ui = { path = "../dilla-desktop-ui" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12" }
# The composer and the sign-in fields (Task 4's proof: Textarea with submit_on_enter).
gpui-component = "=0.9.1"
# The client's state channel (a watch) and the sign-in steps' runtime. Already in the lock.
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }
url = "2"
zeroize = "1"
# Task 19: the Voice section's device, microphone-test and sound threads log what they could not do (already in the lock through dilla-media).
log = "0.4"
# Message times in the local zone (already in the lock through gpui-component).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# The automation build's channel-view fixture (src/fixture.rs), and the updater's feed document (src/updater/feed.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
# The updater (release plan Task 14b, src/updater/): the feed's Ed25519 signature, the assets' SHA-512 and the version
# order. All already in the lock (dilla-core's ed25519-dalek 3.0 and its sha2 0.11).
ed25519-dalek = { version = "3.0", default-features = false, features = ["zeroize"] }
sha2 = "0.11"
semver = "1.0.28"
# The updater's feed and downloads, on the HTTP client dilla-client uses (already in the lock).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# Wave 0/1 (plan R1), declared by Task 1 so Cargo.lock is settled once:
# - Task 6's format.rs follows the OS locale;
# - Task 12's inline audio (Jonas 2026-11-12: symphonia + rodio, no FFmpeg).
sys-locale = "0.3.2"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
# - Task 12's Opus: a pure-Rust port of libopus (BSD-3-Clause, no FFI), so no second libopus beside libwebrtc's.
opus-pure = { version = "=0.2.3", default-features = false }
# - Task 12: the random names of videos handed to the system player.
getrandom = "0.3"
# Parity Package 12, inline video (Jonas 2026-11-15: before the switch; no FFmpeg of our own): libwebrtc's own decoders
# through the patched webrtc-sys (core/vendor/README.md, "dilla_video_decoder"), already linked for calls, and two
# pure-Rust demuxers for the web's playable containers (MP4, WebM/Matroska).
webrtc-sys = "=0.3.53"
re_mp4 = { version = "=0.5.1", default-features = false }
matroska-demuxer = "=0.8.1"

# The second-launch handover's peer check (native/single_instance.rs: SO_PEERCRED / getpeereid, getuid). Already in the
# lock.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# On Linux the platform's windowing and its text system come with its display backends: without them `current_platform`
# has no text system (the headless frame draws no glyphs, Task 3's finding) and no window opens. X11 pulls
# const-random-macro (CC0-1.0, allowed for that crate in deny.toml, ruling R20).
[target.'cfg(target_os = "linux")'.dependencies]
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["wayland", "x11"] }
# AltGr's state (the vendored copy's `level3_shift_active`, core/vendor/README.md): push to talk refuses a key with it.
gpui-linux = { package = "gpui-pre-linux", version = "=0.3.12", default-features = false }
# Printing (src/print.rs): the XDG desktop portal's print dialog, and the anonymous memory file the document is handed
# over in. Both already in the lock (ashpd through gpui-pre-linux, rustix through several crates).
ashpd = { version = "0.13", default-features = false, features = ["async-io", "print"] }
rustix = { version = "1", features = ["fs"] }
# GPUI parity Package 5: the tray as a StatusNotifierItem (pure D-Bus on zbus, which ashpd already brings, on async-io
# as ashpd does; no GTK, no libappindicator), and the launcher badge's Unity LauncherEntry signal on the same zbus.
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# Printing on macOS (src/print.rs): AppKit's print operation, run on the main thread. All already in the lock (through
# GPUI's macOS platform and cpal).
[target.'cfg(target_os = "macos")'.dependencies]
# On macOS the text system is behind `font-kit`: without it gpui-pre-macos installs `NoopTextSystem` and draws no glyph
# at all (only a log warning says so). The dilla-MacBook check of #174 found exactly that: boxes and borders, no text.
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSData", "NSGeometry", "NSObject", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSButton", "NSControl", "NSDockTile", "NSImage", "NSImageView", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
# The traffic lights per window mode (src/native/window_buttons.rs): the window's NSView from GPUI's AppKit handle.
# Already in the lock (through gpui-pre-macos).
raw-window-handle = "0.6"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
# The deallocator block of the NSData that owns the printed copy (already in the lock through objc2-foundation).
block2 = "0.6.2"

# GPUI parity Package 5: the tray (NSStatusItem on macOS, Shell_NotifyIcon on Windows) with muda menus, without its
# Linux backends (Linux uses ksni above).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

# Printing on Windows (src/print.rs): the system's print dialog and GDI. Already in the lock. The parity plan's
# Package 6 (native/single_instance.rs: the handover's named pipe) adds Security, Storage_FileSystem, System_IO and
# System_Pipes; Package 7 (native/permissions.rs: the privacy settings) adds System_Registry.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }

# The video player's parity shots run in their own `main` on the main thread (GPUI's macOS platform requires it).
[[test]]
name = "video_player_shot"
harness = false
required-features = ["automation"]

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
# The slice test and the parity world (tests/support/world.rs) run a real dillad and headless clients, made the way
# dilla-client's sync tests make them. All already in the lock.
dilla-core = { path = "../../../core/dilla-core" }
dilla-testkit = { path = "../../../testkit" }
dilla-parity = { path = "../parity" }
# The shared real-dillad helpers (dilla-client src/testing/host.rs): tests/support/world.rs and the parity world.
dilla-client = { path = "../dilla-client", features = ["testing-host"] }
# The test hooks of AppView (feature `test-hooks`), for this crate's own integration tests.
dilla-desktop = { path = ".", features = ["test-hooks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1.0.151"
url = "2"
hmac = "0.13"
sha1 = "0.11"
