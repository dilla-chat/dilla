# Per-screen Linux limits: twice the screen's honest Linux score (TOLERANCES.md "Linux per-screen"). The picture screens
# scale a thumbnail bilinearly where Skia filters bicubically; the emoji screens draw the colour bitmap face scaled
# otherwise than Skia does (the advances, so every chip and cell edge, are the web's; only the raster differs).
[linux_screens."attachments/cards"]
colour_max_pct = 0.8
[linux_screens."attachments/cards-b"]
chrome_max_pct = 0.84
colour_max_pct = 2.16
[linux_screens."reactions/many-wrapping"]
chrome_max_pct = 0.48
colour_max_pct = 0.54
[linux_screens."reactions/many-wrapping-b"]
chrome_max_pct = 0.47
colour_max_pct = 0.51
[linux_screens."reactions/emoji-grid"]
chrome_max_pct = 0.57
colour_max_pct = 0.88
# Task 19b (Jonas 2026-11-20, "design, not pixels"): Chromium's baseline rounding puts the Segmented groups 1 px higher at
# compact than GPUI's whole-px layout does (TOLERANCES.md "Linux per-screen"); the limit just covers the measured score.
[linux_screens."user-settings/appearance-compact"]
chrome_max_pct = 0.26
# Task 40 (Jonas 2026-11-20, "design, not pixels"): the log keeps whole-pixel row tops where Chromium keeps the fractions of
# its 20.14 px body lines, so the card of a poll post (three rows down) sits half a pixel lower than the web's and its borders
# and answer rows snap a pixel apart (TOLERANCES.md "Linux per-screen"); the limit is twice the measured score.
[linux_screens."polls/card"]
chrome_max_pct = 1.19
# Task 42 (Jonas 2026-11-21, "design, not pixels"): the labels of the DM picker's small "message" buttons are centred at a
# fractional offset in Chromium and one device pixel over in GPUI, row after row (TOLERANCES.md "Linux per-screen"); the limits
# are twice the measured scores.
[linux_screens."dms/picker"]
chrome_max_pct = 0.48
[linux_screens."dms/picker-b"]
chrome_max_pct = 0.58
