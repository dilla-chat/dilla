colour_max_pct = 0.92
[macos_screens."user-settings/profile-b"]
colour_max_pct = 0.73
[macos_screens."user-settings/profile-short-wide"]
colour_max_pct = 1.11
[macos_screens."user-settings/profile-short-wide-b"]
colour_max_pct = 1.36
[macos_screens."members/profile-card"]
colour_max_pct = 0.88
[macos_screens."members/profile-card-b"]
colour_max_pct = 0.74
[macos_screens."voice/stage-focused"]
colour_max_pct = 0.77
[macos_screens."voice/person-menu"]
colour_max_pct = 0.66
# Task 40's poll card: the same half-pixel row-top snap as on Linux (linux_screens."polls/card" below), chrome 0.586 % on
# macos-15 (run 44883563855); the limit is twice that.
[macos_screens."polls/card"]
