[package]
name = "dilla-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false

[lints]
workspace = true

# Every dependency the later desktop tasks need is declared here so Cargo.lock is settled once.
[dependencies]
dilla-core = { path = "../../../core/dilla-core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
async-trait = "0.1"
url = "2"
http = "1"
thiserror = "2"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
# The wire value behind the typed routes (not a normative decoder: strict decoding stays in dilla-core).
ciborium = { version = "0.2.2", default-features = false, features = ["std"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
dirs = "6"
# Task 6: the store opens its own connection (keyed by dilla-core's native_store, on the SQLite3
# Multiple Ciphers build dilla-core links), draws the key from the OS CSPRNG and keeps the instance
# list as JSON.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
libsqlite3-sys = { version = "0.39.1", features = ["bundled-sqlite3mc"] }
getrandom = "0.3"
serde_json = "1.0.151"
# The gateway's socket loop (Task 8): StreamExt/SinkExt over tokio-tungstenite's stream. Already in the lock.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# The gateway's wss: an explicit aws-lc-rs provider (never the process default, which a ring-linking binary lacks) and
# the platform's roots. Both already in the lock through tokio-tungstenite and reqwest.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-native-certs = "0.8"

[dev-dependencies]
# The real-dillad tests enrol an account the way every native peer does.
dilla-testkit = { path = "../../../testkit" }
# RFC 6238 for the sign-in tests; both are already in the lock (the testkit's second factor uses them).
hmac = "0.13"
sha1 = "0.11"
# The wss smoke test's local TLS server (already in the lock through tokio-tungstenite).
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
