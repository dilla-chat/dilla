[package]
name = "dilla-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false

[lints]
workspace = true

# Every dependency the later desktop tasks need is declared here so Cargo.lock is settled once.
[dependencies]
dilla-core = { path = "../../../core/dilla-core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
async-trait = "0.1"
url = "2"
http = "1"
thiserror = "2"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
dirs = "6"
# Task 6: the store keys its own SQLCipher connection (the same build dilla-core links), draws the key
# from the OS CSPRNG and keeps the instance list as JSON. All three were already in Cargo.lock.
rusqlite = { version = "=0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }
getrandom = "0.3"
serde_json = "1"
