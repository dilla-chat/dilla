# The deb and rpm of the native Dilla desktop app (GPUI release plan, Task 2), built by
# scripts/desktop-gpui-package-linux.sh with the pinned nfpm (scripts/install-ci-tool.sh nfpm).
#
# The package is `dilla`, as beta.5's was (release plan D3), so installing it upgrades an installed beta.5 in place:
# the package manager removes Electron's /opt/Dilla files and puts these in their place. The version orders above
# beta.5's: deb 0.2.0~alpha.N-1 > 0.1.0~beta.5-1, rpm 0.2.0-0.alpha.N.1 > 0.1.0-0.beta.5.1. The script sets them per
# format (version_schema none: nfpm takes them as given):
#   DILLA_PKG_VERSION  deb 0.2.0~alpha.N, rpm 0.2.0
#   DILLA_PKG_RELEASE  deb 1,             rpm 0.alpha.N.1
# nfpm runs in the release tarball's directory (dilla-<v>/: dilla-desktop, the desktop entry, the metainfo,
# icons/hicolor/..., licenses/...), which the `./` sources below name.
#
# There are no maintainer scripts: nothing runs as root at install, upgrade or removal, and no script touches user
# data. /usr/bin/dilla-desktop is a two-line script, not a link (usr-bin-dilla-desktop says why: beta.5's deb postrm
# deletes a link there during the upgrade). scripts/desktop-gpui-smoke-linux.sh ubuntu-upgrade and fedora-upgrade
# install this over beta.5.
name: dilla
arch: amd64
platform: linux
version: ${DILLA_PKG_VERSION}
version_schema: none
release: ${DILLA_PKG_RELEASE}
section: net
priority: optional
maintainer: Dilla contributors
vendor: Dilla contributors
homepage: https://github.com/dilla-chat/dilla
license: AGPL-3.0-or-later
description: |-
  Desktop client for Dilla, end-to-end encrypted chat
  The native Dilla desktop app: end-to-end encrypted chat, voice and video
  for self-hosted Dilla servers. Needs a running Secret Service (GNOME
  Keyring, KWallet or KeePassXC) to store its database key.
provides:
  - dilla
contents:
  # The package owns its two directories, so removing it (rpm too) leaves no empty /opt/Dilla behind.
  - dst: /opt/Dilla
    type: dir
    file_info:
      mode: 0755
  - dst: /opt/Dilla/licenses
    type: dir
    file_info:
      mode: 0755
  - src: ./dilla-desktop
    dst: /opt/Dilla/dilla-desktop
    file_info:
      mode: 0755
  - src: ./licenses/*
    dst: /opt/Dilla/licenses/
    file_info:
      mode: 0644
  - src: ../usr-bin-dilla-desktop
    dst: /usr/bin/dilla-desktop
    file_info:
      mode: 0755
  - src: ../copyright
    dst: /usr/share/doc/dilla/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: ./dev.dilla.desktop.desktop
    dst: /usr/share/applications/dev.dilla.desktop.desktop
    file_info:
      mode: 0644
  - src: ./dev.dilla.desktop.metainfo.xml
    dst: /usr/share/metainfo/dev.dilla.desktop.metainfo.xml
    file_info:
      mode: 0644
  # One entry per icon: an nfpm glob flattens directories, and a tree would claim the shared hicolor directories.
  - src: ./icons/hicolor/16x16/apps/dev.dilla.desktop.png
    dst: /usr/share/icons/hicolor/16x16/apps/dev.dilla.desktop.png
    file_info:
      mode: 0644
  - src: ./icons/hicolor/22x22/apps/dev.dilla.desktop.png
    dst: /usr/share/icons/hicolor/22x22/apps/dev.dilla.desktop.png
    file_info:
      mode: 0644
  - src: ./icons/hicolor/24x24/apps/dev.dilla.desktop.png
    dst: /usr/share/icons/hicolor/24x24/apps/dev.dilla.desktop.png
    file_info:
      mode: 0644
  - src: ./icons/hicolor/32x32/apps/dev.dilla.desktop.png
    dst: /usr/share/icons/hicolor/32x32/apps/dev.dilla.desktop.png
    file_info:
      mode: 0644
  - src: ./icons/hicolor/48x48/apps/dev.dilla.desktop.png
    dst: /usr/share/icons/hicolor/48x48/apps/dev.dilla.desktop.png
    file_info:
      mode: 0644
  - src: ./icons/hicolor/64x64/apps/dev.dilla.desktop.png
    dst: /usr/share/icons/hicolor/64x64/apps/dev.dilla.desktop.png
    file_info:
      mode: 0644
  - src: ./icons/hicolor/128x128/apps/dev.dilla.desktop.png
    dst: /usr/share/icons/hicolor/128x128/apps/dev.dilla.desktop.png
    file_info:
      mode: 0644
  - src: ./icons/hicolor/256x256/apps/dev.dilla.desktop.png
    dst: /usr/share/icons/hicolor/256x256/apps/dev.dilla.desktop.png
    file_info:
      mode: 0644
  - src: ./icons/hicolor/512x512/apps/dev.dilla.desktop.png
    dst: /usr/share/icons/hicolor/512x512/apps/dev.dilla.desktop.png
    file_info:
      mode: 0644
  - src: ./icons/hicolor/scalable/apps/dev.dilla.desktop.svg
    dst: /usr/share/icons/hicolor/scalable/apps/dev.dilla.desktop.svg
    file_info:
      mode: 0644
  - src: ./icons/hicolor/symbolic/apps/dev.dilla.desktop-symbolic.svg
    dst: /usr/share/icons/hicolor/symbolic/apps/dev.dilla.desktop-symbolic.svg
    file_info:
      mode: 0644
overrides:
  deb:
    depends:
      - libc6 (>= 2.39)
      - libgcc-s1
      - libxcb1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libasound2t64 | libasound2
      - libpipewire-0.3-0t64 | libpipewire-0.3-0
      - libvulkan1 | libegl1
      - libwayland-client0
      - libx11-6
      - libdrm2
      - libgbm1
      - xdg-utils
    recommends:
      - gnome-keyring | kwalletmanager | keepassxc
      - libpulse0 | pipewire-pulse
      - xdg-desktop-portal
      - fonts-noto-color-emoji
      - mesa-vulkan-drivers
  rpm:
    depends:
      - glibc >= 2.39
      - libgcc
      - libxcb
      - libxkbcommon
      - libxkbcommon-x11
      - alsa-lib
      - pipewire-libs
      - (vulkan-loader or libglvnd-egl)
      - libwayland-client
      - libX11
      - libdrm
      - mesa-libgbm
      - xdg-utils
    recommends:
      - (gnome-keyring or kf6-kwallet or keepassxc)
      - (pulseaudio-libs or pipewire-pulseaudio)
      - xdg-desktop-portal
      - google-noto-color-emoji-fonts
      - mesa-vulkan-drivers
rpm:
  group: Applications/Internet
  summary: Dilla desktop client
deb:
  fields:
    Bugs: https://github.com/dilla-chat/dilla/issues
