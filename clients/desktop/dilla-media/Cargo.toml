[package]
name = "dilla-media"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
dilla-core = { path = "../../../core/dilla-core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# `rustls-tls-native-roots`: the signalling socket's TLS. Without it livekit-net's tokio-tungstenite 0.29 has no TLS at
# all and every `wss://` room (dillad hands out `wss://<host>`) fails with "TLS support not compiled in"; only the
# tests' `ws://` rooms connected. The crates are already in the lock (rustls, tokio-rustls, rustls-native-certs).
livekit = { version = "=0.10.1", features = ["rustls-tls-native-roots"] }
# The process-wide rustls provider that socket's `ClientConfig::builder()` needs: rustls is built with both ring and
# aws-lc-rs here, so none is chosen on its own (src/tls.rs). Already in the lock.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
# The dilla-sframe/1 hook (core/vendor/webrtc-sys, patched in the root Cargo.toml): the same crate
# livekit links, used directly for `dilla_transform`.
webrtc-sys = "=0.3.53"
# The camera bridge's handle (core/vendor/webrtc-sys `dilla_camera`, parity plan Package 1): the cxx webrtc-sys links.
cxx = "=1.0.205"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zeroize = "1"
# The enhanced noise mode: DeepFilterNet3 (MIT OR Apache-2.0, model embedded; NOTICE.md of the
# crate: the weights are licensed like the code since upstream 7b14b89), on tract, pure Rust.
deep-filter-rt = "=0.2.0"
ndarray = "0.17"
# Task 4 (plan R1, declared by Task 1 so Cargo.lock is settled once): device capture and playout. The cpal rodio uses
# (dilla-desktop), so the lock holds one.
cpal = "0.18.2"

[dev-dependencies]
# The hook's synthetic-frame test support (webrtc_sys::dilla_transform_testing): tests only, never in
# a shipping binary.
webrtc-sys = { version = "=0.3.53", features = ["dilla-test-frames"] }
# tests/link.rs (Task 6b): open flags for the keyed store; the same rusqlite dilla-core links.
rusqlite = "=0.41.1"
# tests/call.rs: real call-group keys from a `ClientCore` and a `DillaGroup` member, through
# dilla-core's own test fixtures (tests/client_support), which need these (already in the lock).
openmls = { version = "=0.9.0", default-features = false }
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
openmls_basic_credential = "=0.6.0"
tls_codec = { version = "=0.5.0", features = ["derive", "serde", "mls"] }
# examples/call-peer.rs (the live tests' participant): its stdin/stdout line protocol.
serde_json = "1.0.151"
# tests/e2e_call.rs (screens wave 1, Task 3): two desktop clients' call signalling through a real dillad, the accounts
# enrolled as dilla-client's tests enrol them (the testkit, an authenticator app over RFC 6238). All already in the lock.
# Task 28 wave 2: tests/call.rs's Bot music timing tests use its real-dillad helpers (`testing::host::music`).
dilla-client = { path = "../dilla-client", features = ["testing-host"] }
dilla-testkit = { path = "../../../testkit" }
hmac = "0.13"
sha1 = "0.11"
tokio = { version = "1", features = ["io-std", "io-util"] }
# src/tls.rs's test: LiveKit's own WebSocket transport opens a `wss://` URL (already in the lock through livekit).
livekit-net = "=0.1.4"

# Application audio on Linux (parity plan Package 3): the PipeWire client (registry, links, a capture stream), as beta.5's
# native/linux.cpp used libpipewire. Needs libpipewire-0.3-dev to build (CI installs it).
[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "=0.9.2"

# Application audio on Windows (GPUI gaps Task 4): WASAPI process loopback. The `windows` 0.62.2 already in the lock
# (tauri-winrt-notification's); only the modules app_audio/windows.rs calls are enabled. `windows-core` directly too:
# the `#[implement]` macro (the activation's completion handler) names the `windows_core` crate.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
] }
windows-core = "=0.62.2"

# Application audio on macOS (GPUI gaps Task 5, 14.2 and later): CoreAudio process taps. The objc2 0.6 / 0.3.2 family
# already in the lock (gpui's, cpal's, dilla-desktop's); only what app_audio/macos.rs calls is enabled. libc: the
# process table (proc_pidinfo, proc_name) and dlsym for the two tap functions macOS 13 lacks.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = ["std", "AudioConverter"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSUUID", "NSValue"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication"] }
