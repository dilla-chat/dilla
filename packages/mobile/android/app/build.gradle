apply plugin: 'com.android.application'

android {
    namespace = "chat.dilla.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "chat.dilla.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // The release workflow sets both (build number and marketing version); without them the build is unchanged.
        versionCode((System.getenv('DILLA_ANDROID_VERSION_CODE') ?: '1') as Integer)
        versionName System.getenv('DILLA_ANDROID_VERSION_NAME') ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing comes from the environment (CI writes the keystore from a secret). Without all four variables
    // assembleRelease still builds the unsigned app-release-unsigned.apk.
    // Any of the four set (even to "", which is what an unset GitHub secret expands to) means a signed build is wanted:
    // then all four must be non-empty, or the build fails naming the missing variables (never their values).
    def signingVars = ['DILLA_ANDROID_KEYSTORE', 'DILLA_ANDROID_KEYSTORE_PASSWORD', 'DILLA_ANDROID_KEY_ALIAS', 'DILLA_ANDROID_KEY_PASSWORD']
    def releaseSigning = signingVars.any { System.getenv(it) != null }
    if (releaseSigning) {
        def missing = signingVars.findAll { !System.getenv(it) }
        if (missing) throw new GradleException("release signing: missing or empty ${missing.join(', ')}")
        if (!file(System.getenv('DILLA_ANDROID_KEYSTORE')).isFile()) throw new GradleException('release signing: DILLA_ANDROID_KEYSTORE is not a file')
    }
    if (releaseSigning) {
        signingConfigs {
            release {
                storeFile file(System.getenv('DILLA_ANDROID_KEYSTORE'))
                storePassword System.getenv('DILLA_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DILLA_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('DILLA_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
