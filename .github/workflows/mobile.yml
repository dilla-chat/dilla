name: mobile
on:
  push:
    branches: [main]
  pull_request:
  # Nightly on main with every area on: a server-only change does not run this lane (scripts/ci-areas.mjs), so drift in
  # the test host, the SDKs or the runner images surfaces within a day.
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  # The iOS and Android apps (packages/mobile): unit tests and typecheck, the mobile build of the client, the debug and
  # release APKs with the release network-config check, the Android emulator smoke test against two local test hosts,
  # and an iOS simulator build. Structure as desktop-ci.yml: area-gated jobs (the `mobile` area of scripts/ci-areas.mjs),
  # the watchdog, a completion barrier and one aggregate check, mobile-ok.
  ci-watchdog:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/ci-watchdog.py
        env:
          GH_TOKEN: ${{ github.token }}
          # This workflow's roots and DAG barrier: the watcher is done once they and every other job completed.
          CI_COMPLETION_JOBS: changes mobile-work-complete

  # The same job as desktop-ci.yml's and server.yml's (scripts/ci-areas.mjs). Every other job is gated on the mobile
  # output: the apps' package and every package or core source the bundled client is built from.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.areas.outputs.go }}
      core: ${{ steps.areas.outputs.core }}
      web: ${{ steps.areas.outputs.web }}
      e2e: ${{ steps.areas.outputs.e2e }}
      text: ${{ steps.areas.outputs.text }}
      mobile: ${{ steps.areas.outputs.mobile }}
      code: ${{ steps.areas.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: areas
        run: node scripts/ci-areas.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  mobile-unit:
    needs: [changes]
    if: needs.changes.outputs.mobile != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w @dilla/mobile
      - run: npm run typecheck -w @dilla/mobile

  # desktop-ci.yml's web-build, unchanged (a job several workflows carry runs once in ci:local, so it must be the same):
  # its dilla-desktop-core artifact (the wasm core) is what mobile-bundle builds the mobile client from.
  web-build:
    needs: [changes]
    if: needs.changes.outputs.mobile != 'false'
    runs-on: ubuntu-24.04
    # Build the bundled UI once for Electron, shared core integration and go-release, so every
    # consumer tests or ships the same bytes. The webdist test is web.New's manifest check over
    # packages/web/dist, where the build left it: nothing is copied into internal/web/dist (ruling 38).
    timeout-minutes: 15
    # The wasm C build (sqlite-wasm-rs compiles SQLite3MC through cc) uses clang 23, the dev box's major:
    # the runner's own clang emits about 25 KB more wasm, so the D5 budget would not mean the same bytes here.
    env:
      CC_wasm32_unknown_unknown: /usr/bin/clang-23
      AR_wasm32_unknown_unknown: /usr/bin/llvm-ar-23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: clang23-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/llvm-23-debs
          key: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-latest
          restore-keys: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-
      - id: clang23
        name: clang 23 for the wasm C build
        run: bash scripts/ci-llvm.sh install
      - if: steps.clang23.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/llvm-23-debs
          key: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-${{ steps.clang23.outputs.build }}
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Download Go modules (retried only on known network errors)
        run: node scripts/retry-on.mjs --pattern 'proxy\.golang\.org[^\n]*:\s(50[0-4]|429)\b|stream error|INTERNAL_ERROR|TLS handshake timeout|connection reset|i/o timeout' -- go mod download
      - run: bash scripts/install-ci-tool.sh wasm-bindgen
      - run: bash scripts/install-ci-tool.sh wasm-pack
      - run: bash scripts/install-ci-tool.sh binaryen
      - run: wasm-pack build core/dilla-core-wasm --target web --profile wasm-release --mode no-install --out-dir ../../packages/core-wasm/pkg
      - run: node scripts/check-wasm-size.mjs packages/core-wasm/pkg/dilla_core_wasm_bg.wasm
      - run: npm ci
      - run: npm run typecheck -w @dilla/core-wasm
      - run: npm run typecheck -w @dilla/client-core
      - run: npm run typecheck -w @dilla/web
      - run: npm run typecheck:e2e
      - run: npm run build -w @dilla/web
      - run: npm run test:noise-release
      # The dist guard fails (never skips) on any data: URL in the built CSS or JS; it needs the build above.
      - run: npm run -w @dilla/web test:dist
      - run: npm run build:harness -w @dilla/client-core
      - run: go test -tags webdist ./internal/web/...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-web-dist
          path: packages/web/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-desktop-core
          path: packages/core-wasm/pkg/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-core-harness
          path: packages/client-core/harness-dist/
          if-no-files-found: error

  # The mobile client (packages/mobile/dist): the @dilla/web build with __DILLA_MOBILE__, the CSP, the bridge and the
  # picker. Built once, so the APKs and the iOS app carry the same bytes.
  mobile-bundle:
    needs: [changes, web-build]
    if: needs.changes.outputs.mobile != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fetch the wasm core built by the web-build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-desktop-core
          path: packages/core-wasm/pkg
      - run: npm ci
      - run: npm run build -w @dilla/mobile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-mobile-dist
          path: packages/mobile/dist/
          if-no-files-found: error

  # What the emulator smoke test runs beside the app: two test hosts (with the WASI core) and the native peer. Its own
  # job, so it builds while the client does; artifacts never cross workflows, so this one builds its own.
  mobile-e2e-tools:
    needs: [changes]
    if: needs.changes.outputs.mobile != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Download Go modules (retried only on known network errors)
        run: node scripts/retry-on.mjs --pattern 'proxy\.golang\.org[^\n]*:\s(50[0-4]|429)\b|stream error|INTERNAL_ERROR|TLS handshake timeout|connection reset|i/o timeout' -- go mod download
      - run: go build -o target/dilla-testhost ./cmd/dilla-testhost
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo build -p dilla-testkit --release --locked
      - run: cargo build -p dilla-core-wasi --target wasm32-wasip1 --release --locked
      - name: Gather the smoke test's tools
        run: |
          mkdir -p target/mobile-e2e-tools
          cp target/dilla-testhost target/release/dilla-testkit target/wasm32-wasip1/release/dilla_core_wasi.wasm target/mobile-e2e-tools/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-e2e-tools
          path: target/mobile-e2e-tools/
          if-no-files-found: error

  # The debug and release APKs, the release APK's network-config check (system CAs only, no cleartext), then the
  # emulator smoke test (packages/mobile/e2e/android-smoke.mjs, see packages/mobile/README.md) on the debug APK. KVM, the
  # SDK, JDK 21 and Gradle are the runner image's; the system image and Gradle's downloads are cached and retried.
  mobile-android:
    needs: [changes, mobile-bundle, mobile-e2e-tools]
    if: needs.changes.outputs.mobile != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch the mobile client built by the mobile-bundle job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-mobile-dist
          path: packages/mobile/dist
      - name: Fetch the test hosts, the WASI core and the native peer built by the mobile-e2e-tools job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mobile-e2e-tools
          path: target/mobile-e2e-tools
      - name: Put the smoke test's tools where it reads them
        run: |
          mkdir -p target/release internal/mlswasi/testdata
          install -m 755 target/mobile-e2e-tools/dilla-testhost target/dilla-testhost
          install -m 755 target/mobile-e2e-tools/dilla-testkit target/release/dilla-testkit
          install -m 644 target/mobile-e2e-tools/dilla_core_wasi.wasm internal/mlswasi/testdata/dilla_core_wasi.wasm
      # Gradle rejects JDKs newer than 21 (packages/mobile/README.md); the image carries 21 beside its default.
      - name: JDK 21 for Gradle
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - run: cd packages/mobile && npx cap sync android
      - name: Cache Gradle's distribution and dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'packages/mobile/android/build.gradle', 'packages/mobile/android/app/build.gradle', 'packages/mobile/android/variables.gradle', 'package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Build the debug and release APKs (retried only on known network errors)
        run: node scripts/retry-on.mjs --pattern 'Could not (GET|HEAD) .{1,400}Received status code (50[0-4]|429)|Server returned HTTP response code. (50[0-4]|429)|Read timed out|Connect timed out|Connection reset|Remote host terminated the handshake|UnknownHostException|SocketTimeoutException' -- packages/mobile/android/gradlew -p packages/mobile/android --no-daemon assembleDebug assembleRelease
      - run: npm run android:check-release -w @dilla/mobile
      - name: KVM for the emulator
        run: bash scripts/ci-android.sh kvm
      - id: android-sdk
        run: echo "root=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
      - id: android-image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.android-sdk.outputs.root }}/system-images/android-35/google_apis/x86_64
          key: android-system-image-${{ runner.os }}-android-35-google_apis-x86_64
      - name: Android SDK packages and the system image (retried only on known network errors)
        run: node scripts/retry-on.mjs --pattern 'Failed to download|Connection reset|Read timed out|Connect timed out|UnknownHostException|SocketException|SocketTimeoutException|HTTP (50[0-4]|429)' -- bash scripts/ci-android.sh sdk
      - if: steps.android-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.android-sdk.outputs.root }}/system-images/android-35/google_apis/x86_64
          key: ${{ steps.android-image.outputs.cache-primary-key }}
      - run: bash scripts/ci-android.sh avd
      - name: Emulator smoke test
        timeout-minutes: 20
        run: npm run e2e:android -w @dilla/mobile -- --skip-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() && hashFiles('packages/mobile/e2e/.out/**') != ''
        with:
          name: mobile-android-results
          path: packages/mobile/e2e/.out
          include-hidden-files: true
          if-no-files-found: error

  # The simulator build of the iOS app (Capacitor 8.6, Swift Package Manager, iOS 17 target, the UIScene lifecycle),
  # unsigned. Swift packages resolve into a cached directory first, retried; the build then resolves nothing.
  mobile-ios:
    needs: [changes, mobile-bundle]
    if: needs.changes.outputs.mobile != 'false'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch the mobile client built by the mobile-bundle job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-mobile-dist
          path: packages/mobile/dist
      - run: cd packages/mobile && npx cap sync ios
      - run: xcodebuild -version
      - name: Cache the Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/spm
          key: spm-${{ runner.os }}-${{ hashFiles('packages/mobile/ios/App/CapApp-SPM/Package.swift', 'packages/mobile/ios/App/App.xcodeproj/project.pbxproj', 'package-lock.json') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Resolve the Swift packages (retried only on known network errors)
        run: node scripts/retry-on.mjs --pattern 'Could not resolve host|The network connection was lost|The request timed out|Connection reset by peer|RPC failed|SSL_ERROR_SYSCALL|Failed to connect to|returned error. (50[0-4]|429)' -- xcodebuild -resolvePackageDependencies -project packages/mobile/ios/App/App.xcodeproj -scheme App -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm"
      - name: Simulator build
        run: xcodebuild -project packages/mobile/ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -disableAutomaticPackageResolution -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build

  # A DAG barrier prevents the watcher exiting between root jobs and later children. This does no build work and never
  # depends on the watcher or final aggregator.
  mobile-work-complete:
    needs: [changes, mobile-unit, web-build, mobile-bundle, mobile-e2e-tools, mobile-android, mobile-ios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "All CI work reached a terminal result"

  # One check for the whole workflow: red on any failure/cancellation, green for success or intentional skips.
  mobile-ok:
    needs: [ci-watchdog, mobile-work-complete, changes, mobile-unit, web-build, mobile-bundle, mobile-e2e-tools, mobile-android, mobile-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      # Fork PR tokens cannot cancel runs, so their watcher is deliberately skipped.
      - if: needs.ci-watchdog.result == 'skipped' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: exit 1
      - run: echo ok
