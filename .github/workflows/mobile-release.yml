name: mobile-release
# The mobile half of a release. release.yml creates every v* release as a DRAFT with the server assets. After it
# succeeds, this workflow builds the release-signed Android APK from the tag's commit, attaches it and its checksum
# to the draft, adds the APK's line to SHA256SUMS and publishes the release; independently it uploads the iOS app to
# TestFlight. Both apps use the same recipe as mobile.yml. Not a CI workflow: nothing gates a pull request on it.
#
# Why here and not in release.yml: a v* tag run uses the workflow file at the tagged commit, which anyone who can push
# a tag can edit. This workflow always runs main's file (workflow_run runs the default branch's; a dispatch must be
# from main, and resolve refuses any other ref). The signing secrets live only in the `mobile-release` environment,
# whose deployment policy is main only. Releases are immutable once published, so the APK goes onto the draft; if
# Android fails, the release stays a draft (lockstep): fix it and dispatch this workflow for the tag. For a release
# that is already published, a run (such as a dispatch after adding the App Store Connect secrets) builds TestFlight only.
#
# Each secret job checks its own secrets first and fails naming the missing ones, never printing a value. The bundle
# and publish jobs hold no secrets; only publish may write (contents: write) and it enters no environment. Like
# release.yml, no job restores a build cache: it publishes what people install.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: the release tag to build the mobile apps for, e.g. v0.1.0 (a draft gets the APK and is published; a published release reruns TestFlight only)
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  # Which tag, which commit and which numbers. A workflow_run builds only when the release run succeeded and ran for a
  # v* tag (with workflow_run, head_branch is the tag name for a tag push); a failed or non-tag release run, or a
  # desktop-v* tag, builds nothing. For a published release (immutable) only TestFlight runs: draft=false skips Android.
  resolve:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') && !startsWith(github.event.workflow_run.head_branch, 'desktop-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      sha: ${{ steps.r.outputs.sha }}
      version: ${{ steps.r.outputs.version }}
      draft: ${{ steps.r.outputs.draft }}
    steps:
      # Full history, for the on-main check below. Default ref (main): resolve builds nothing from the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Only main's workflow file runs here (a dispatch from another branch would run that branch's file).
          [ "$RUN_REF" = refs/heads/main ] || { echo "run this workflow from main, not $RUN_REF"; exit 1; }
          if [ "$EVENT_NAME" = workflow_run ]; then tag="$RUN_TAG"; else tag="$INPUT_TAG"; fi
          case "$tag" in
            desktop-v*) echo "$tag is a desktop release tag; the mobile builds follow server releases only"; exit 1 ;;
          esac
          if ! [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "release tags look like v1.2.3 or v1.2.3-mobile1, got: $tag"; exit 1
          fi
          # A published release is immutable: the APK can never be added to it, so Android is skipped (draft=false) and
          # only TestFlight runs, which attaches nothing. The tags endpoint answers only for a published release; a 404
          # means a draft (or none: the publish job, whose token can see drafts, requires the draft before it uploads
          # anything). Any other failure is shown.
          draft=true
          if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .draft 2>&1); then
            if [ "$out" != true ]; then
              draft=false
              echo "::notice::the release of $tag is already published, and published releases are immutable: Android (android-release, publish) is skipped; only the TestFlight build runs"
            fi
          elif ! printf '%s' "$out" | grep -q 'HTTP 404'; then
            echo "could not look up the release of $tag: $out"
            exit 1
          fi
          if [ "$EVENT_NAME" = workflow_run ]; then
            sha="$RUN_SHA"
          else
            # The commit the tag points at (refs/tags/ is unambiguous even if a branch has the same name).
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha)
          fi
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "could not resolve $tag to a commit"; exit 1; }
          # The signing keys are only ever used on a commit of main that release.yml gated.
          git merge-base --is-ancestor "$sha" origin/main || { echo "$tag points at $sha, which is not on main; the mobile builds, which hold the signing secrets, run only for commits of main"; exit 1; }
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=$tag&status=success&per_page=100" --jq "[.workflow_runs[] | select(.head_branch == \"$tag\" and .head_sha == \"$sha\")] | length")
            [ "${ok:-0}" -gt 0 ] || { echo "no successful release.yml run for $tag at $sha; the mobile builds follow a release.yml run that gated this commit"; exit 1; }
          fi
          # 0.1.0 from v0.1.0-mobile1: the leading v and any -suffix removed.
          version="${tag#v}"; version="${version%%-*}"
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "version=$version"
            echo "draft=$draft"
          } >> "$GITHUB_OUTPUT"
          echo "mobile build of $tag at $sha: version $version"

  # The mobile client (packages/mobile/dist) and the wasm core it bundles, as mobile.yml's mobile-core-wasm and
  # mobile-bundle jobs build them, in one job. No secrets here; both app jobs ship these bytes.
  mobile-bundle:
    needs: [resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The wasm C build (sqlite-wasm-rs compiles SQLite3MC through cc) uses clang 23, as mobile.yml does.
    env:
      CC_wasm32_unknown_unknown: /usr/bin/clang-23
      AR_wasm32_unknown_unknown: /usr/bin/llvm-ar-23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: clang 23 for the wasm C build
        run: bash scripts/ci-llvm.sh install
      - run: rustup show active-toolchain
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: bash scripts/install-ci-tool.sh wasm-bindgen
      - run: bash scripts/install-ci-tool.sh wasm-pack
      - run: bash scripts/install-ci-tool.sh binaryen
      - run: wasm-pack build core/dilla-core-wasm --target web --profile wasm-release --mode no-install --out-dir ../../packages/core-wasm/pkg
      - run: node scripts/check-wasm-size.mjs packages/core-wasm/pkg/dilla_core_wasm_bg.wasm
      - run: npm ci
      - run: npm run build -w @dilla/mobile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-mobile-dist
          path: packages/mobile/dist/
          if-no-files-found: error

  # The release-signed APK: signed from the environment's keystore, proven to be signed by the pinned certificate and to
  # trust system CAs only with no cleartext, then handed to the publish job as an artifact. This job cannot write. It and
  # publish run only for a draft (a published release is immutable); the plain condition keeps needs in force: they
  # run only if their needs succeeded.
  android-release:
    needs: [resolve, mobile-bundle]
    if: needs.resolve.outputs.draft == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: mobile-release
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      # The Android versionCode, computed from this job's own attempt so a rerun gets a fresh one. Runs of this workflow
      # and attempts only grow it: 1000 + run_number*10 + run_attempt (run 2, the first after run 1, gives 1021, above
      # the hand-built v0.1.0-mobile2's 1001), so at most 9 attempts per run (a 10th would collide with the next run's
      # number). It stays monotonic only while this file keeps its workflow id: renaming or re-adding it resets
      # run_number, and Android refuses an update with a lower versionCode.
      - name: Build number
        id: build
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" -gt 9 ]; then echo "::error::attempt $RUN_ATTEMPT: more than 9 attempts of one run would reuse the next run's build number; dispatch a new run"; exit 1; fi
          echo "number=$((1000 + RUN_NUMBER * 10 + RUN_ATTEMPT))" >> "$GITHUB_OUTPUT"
      - name: The signing secrets are set
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing or empty secrets in the mobile-release environment:$missing"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Fetch the mobile client built by the mobile-bundle job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-mobile-dist
          path: packages/mobile/dist
      # Gradle rejects JDKs newer than 21 (packages/mobile/README.md); the image carries 21 beside its default.
      - name: JDK 21 for Gradle
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - run: cd packages/mobile && npx cap sync android
      # The build runs third-party code (Gradle plugins, npm packages), so it never sees the key (defence in depth, not a security boundary: a process an earlier step left running could still read it): it builds the release APK
      # unsigned, and the next step alone holds the keystore and its passwords, signs with apksigner and removes the file.
      - name: Build the release APK, unsigned (retried only on known network errors)
        env:
          DILLA_ANDROID_VERSION_CODE: ${{ steps.build.outputs.number }}
          DILLA_ANDROID_VERSION_NAME: ${{ needs.resolve.outputs.version }}
        run: node scripts/retry-on.mjs --pattern 'Could not (GET|HEAD) .{1,400}Received status code (50[0-4]|429)|Server returned HTTP response code. (50[0-4]|429)|Read timed out|Connect timed out|Connection reset|Remote host terminated the handshake|UnknownHostException|SocketTimeoutException' -- packages/mobile/android/gradlew -p packages/mobile/android --no-daemon assembleRelease
      - name: Sign the APK with the release key (the keystore exists only during this step)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # The alias is not a secret: as one, GitHub masked every "dilla" in the job log.
          KEY_ALIAS: dilla
        run: |
          umask 077
          ks="$RUNNER_TEMP/dilla-release.p12"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ks"
          test -s "$ks" || { echo "::error::ANDROID_KEYSTORE_B64 decodes to an empty file"; exit 1; }
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          out=packages/mobile/android/app/build/outputs/apk/release
          "$tools/zipalign" -P 16 -f 4 "$out/app-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$out/app-release.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/aligned.apk"
      - name: The APK is signed by the pinned release key
        run: npm run android:check-signer -w @dilla/mobile
      - name: The APK trusts system CAs only and allows no cleartext
        run: npm run android:check-release-signed -w @dilla/mobile
      - name: Remove the keystore (backstop, the signing step removes it on exit)
        if: always()
        run: rm -f "$RUNNER_TEMP/dilla-release.p12"
      - name: Name the APK for the release and write its checksum
        run: |
          mkdir -p dist
          cp packages/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/dilla-$TAG.apk"
          # sha256sum format with the bare filename, so `sha256sum -c` works where the two are downloaded.
          cd dist && sha256sum "dilla-$TAG.apk" > "dilla-$TAG.apk.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-android-apk
          path: dist/
          if-no-files-found: error

  # Attaches the APK and its checksum to the draft, adds the APK's line to SHA256SUMS, checks the draft's assets and
  # publishes it. The only job that writes; it holds no secret and enters no environment. While the release is a
  # draft every upload may replace (--clobber), so a rerun repairs a half-finished one; once published, nothing can.
  # It does not wait for TestFlight, which attaches nothing.
  publish:
    needs: [resolve, android-release]
    if: needs.resolve.outputs.draft == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The release is a draft
        id: draft
        run: |
          # Drafts are listed only to a token that can write, which is why this check lives here and not in resolve.
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")
          [ "$(printf '%s\n' "$releases" | grep -c .)" -eq 1 ] || { echo "::error::expected exactly one release for $TAG, found: ${releases:-none}"; exit 1; }
          read -r id draft <<< "$releases"
          [ "$draft" = true ] || { echo "::error::the release of $TAG is already published and immutable; its assets cannot be changed"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Fetch the APK and its checksum
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-android-apk
          path: apk
      - name: Add the APK to SHA256SUMS and attach it to the draft
        run: |
          apk="dilla-$TAG.apk"
          cd apk
          sha256sum -c --strict "$apk.sha256"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir server
          test -s server/SHA256SUMS
          # The server lines as release.yml wrote them, any APK line of an earlier attempt dropped, then the APK's line
          # in the same sha256sum format.
          awk -v n="$apk" '$2 != n' server/SHA256SUMS > SHA256SUMS
          sha256sum "$apk" >> SHA256SUMS
          test "$(grep -c " $apk\$" SHA256SUMS)" -eq 1
          gh release upload "$TAG" "$apk" "$apk.sha256" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
      - name: The draft holds exactly the release's assets, and they match SHA256SUMS
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          apk="dilla-$TAG.apk"
          want=$(printf '%s\n' dillad-linux-amd64 dillad-linux-arm64 dillabot-linux-amd64 dillabot-linux-arm64 dilla-bot-core-linux-amd64 dilla-bot-core-linux-arm64 dilla_core_wasi.wasm install.sh install-bot.sh "$apk" "$apk.sha256" SHA256SUMS | sort)
          have=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[].name' | sort)
          [ "$have" = "$want" ] || { echo "::error::the draft's assets differ from the release's:"; diff <(echo "$want") <(echo "$have"); exit 1; }
          mkdir verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify
          cd verify
          sha256sum -c --strict SHA256SUMS
          sha256sum -c --strict "$apk.sha256"
          test "$(wc -l < SHA256SUMS)" -eq 10
      - name: Publish the release
        run: |
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft)" = false

  # The iOS app to TestFlight: archived unsigned, then exported with automatic signing and destination upload. The team
  # id is the environment variable APPLE_TEAM_ID, never in the repo. ASC_KEY_P8 must be a Team key with the Admin role:
  # Xcode's cloud-managed distribution signing, which the export uses, needs it (an App Manager key fails with a cloud
  # signing permission error).
  ios-testflight:
    needs: [resolve, mobile-bundle]
    runs-on: macos-26
    timeout-minutes: 45
    environment: mobile-release
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      # The build number is computed here, from this job's own attempt, so re-running just this job gets a fresh one
      # (TestFlight rejects a reused build number). Runs of this workflow and attempts only grow it: 1000 + run_number*10
      # + run_attempt, so at most 9 attempts per run (a 10th would collide with the next run's number). TestFlight build
      # numbers are independent of the Android versionCode, though both use this formula.
      - name: Build number
        id: build
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" -gt 9 ]; then echo "::error::attempt $RUN_ATTEMPT: more than 9 attempts of one run would reuse the next run's build number; dispatch a new run"; exit 1; fi
          echo "number=$((1000 + RUN_NUMBER * 10 + RUN_ATTEMPT))" >> "$GITHUB_OUTPUT"
      - name: The App Store Connect secrets and team id are set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing or empty in the mobile-release environment (secrets, and the variable APPLE_TEAM_ID):$missing. ASC_KEY_P8 is an App Store Connect Team key with the Admin role (needed for cloud signing)"
            exit 1
          fi
          printf '%s' "$APPLE_TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$' || { echo "::error::APPLE_TEAM_ID is not a 10-character team id"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Fetch the mobile client built by the mobile-bundle job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-mobile-dist
          path: packages/mobile/dist
      - run: cd packages/mobile && npx cap sync ios
      # Pinned as mobile.yml pins it, so an image update cannot change the toolchain under the build.
      - name: Xcode 26.6
        run: |
          if [ ! -d /Applications/Xcode_26.6.app ]; then
            echo "Xcode 26.6 is not on this runner image; installed:" >&2
            ls -d /Applications/Xcode_*.app >&2
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Resolve the Swift packages (retried only on known network errors)
        run: node scripts/retry-on.mjs --pattern 'Could not resolve host|The network connection was lost|The request timed out|Connection reset by peer|RPC failed|SSL_ERROR_SYSCALL|Failed to connect to|returned error. (50[0-4]|429)' -- xcodebuild -resolvePackageDependencies -project packages/mobile/ios/App/App.xcodeproj -scheme App -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm"
      - name: Write the export options
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          cp packages/mobile/ios/App/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
      # Unsigned on purpose: with no device on the team, a signed archive would need a development profile, and it would
      # create a development certificate on every run. The export signs for distribution instead, with an Apple-managed
      # distribution certificate (-allowProvisioningUpdates and the Admin API key): nothing is created per run.
      - name: Archive (unsigned)
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD: ${{ steps.build.outputs.number }}
        run: |
          xcodebuild archive -project packages/mobile/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Dilla.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD"
      # The Admin API key exists only during this step: the archive (which runs build scripts) never sees it (defence in depth, not a boundary: a process left running by an earlier step could still read it).
      - name: Export and upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/asc-key.p8"' EXIT
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc-key.p8"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Dilla.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc-key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the API key (backstop, the export step removes it on exit)
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-key.p8"
