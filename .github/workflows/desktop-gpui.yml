name: desktop-gpui
run-name: desktop-gpui [${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && inputs.tier || 'pr' }}]
# The native GPUI desktop client (clients/desktop). desktop-ci.yml (check desktop-ok) runs the shared web, UI and core
# checks; this one builds, lints and tests only the GPUI crates and the parity harness.
# Three tiers (env.TIER): pr (pull requests and main pushes), nightly (03:00 UTC on main, or a manual run) and release (a manual
# run the release gate dispatches). The heavy macOS call, parity and VideoToolbox steps and the Linux Bot shard run outside pr.
on:
  push:
    branches: [main]
    paths:
      - 'clients/desktop/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - 'packages/design-tokens/src/tokens.ts'
      - 'packages/ui/src/Icon/icons.ts'
      - 'packages/web/src/strings/**'
      - 'packages/media/**'
      - 'scripts/gen-gpui-*.mjs'
      - 'scripts/check-glibc-max.sh'
      - 'scripts/desktop-gpui-package-mac.sh'
      - 'scripts/desktop-gpui-package-win.*'
      - 'scripts/fetch-libwebrtc.sh'
      - 'cmd/dilla-testhost/**'
      - 'cmd/dilla-tlsproxy/**'
      - 'scripts/desktop-gpui-mac-ui.sh'
      - 'scripts/mac-*.swift'
      - 'cmd/dillabot/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop-gpui.yml'
  pull_request:
    paths:
      - 'clients/desktop/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - 'packages/design-tokens/src/tokens.ts'
      - 'packages/ui/src/Icon/icons.ts'
      - 'packages/web/src/strings/**'
      - 'packages/media/**'
      - 'scripts/gen-gpui-*.mjs'
      - 'scripts/check-glibc-max.sh'
      - 'scripts/desktop-gpui-package-mac.sh'
      - 'scripts/desktop-gpui-package-win.*'
      - 'scripts/fetch-libwebrtc.sh'
      - 'cmd/dilla-testhost/**'
      - 'cmd/dilla-tlsproxy/**'
      - 'scripts/desktop-gpui-mac-ui.sh'
      - 'scripts/mac-*.swift'
      - 'cmd/dillabot/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop-gpui.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      tier:
        type: choice
        options: [nightly, release]
        default: nightly
permissions:
  contents: read
concurrency:
  group: desktop-gpui-${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && inputs.tier || 'pr' }}-${{ github.ref }}
  cancel-in-progress: true
env:
  TIER: ${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && inputs.tier || 'pr' }}
  GPUI_CRATES: -p dilla-client -p dilla-media -p dilla-desktop-ui -p dilla-desktop -p dilla-parity
  # The test binaries of five crates (libwebrtc, GPUI, wasmtime), each linked whole, with debug info filled the Linux and
  # macOS runners' disks ("No space left on device" in cargo test, errno 28 in ld). A panic still names its location.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
jobs:
  # CI speed plan, Task 6: a push to main whose tree a green pull_request run of this workflow already proved skips its
  # work. scripts/ci-same-tree.mjs decides, and anything it cannot prove (an API error included) is "run in full"; every
  # other event outputs skip=false without asking the API. same-tree carries the decision in its name, `same-tree:
  # skipped` or `same-tree: ran`, and the release gates never count a run with the skipped one. The jobs after it run
  # unless skip is 'true', also when the check itself failed: a broken check never turns into a skip.
  check-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.tree.outputs.skip == 'true' && 'true' || 'false' }}
    steps:
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci-same-tree.mjs
            scripts/server-release-gate.mjs
            scripts/ci-nightly-issue.mjs
          sparse-checkout-cone-mode: false
      - id: tree
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/ci-same-tree.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: desktop-gpui.yml

  same-tree:
    name: "same-tree: ${{ needs.check-tree.outputs.skip == 'true' && 'skipped' || 'ran' }}"
    needs: [check-tree]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ needs.check-tree.outputs.skip == 'true' && 'true' || 'false' }}
    steps:
      - run: echo "skip=$SKIP"
        env:
          SKIP: ${{ needs.check-tree.outputs.skip }}

  gpui:
    name: gpui-${{ matrix.platform }}-${{ matrix.arch }}
    needs: [same-tree]
    if: ${{ !cancelled() && needs.same-tree.outputs.skip != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120  # Windows rebuilds every dependency with the static CRT (libwebrtc)
    strategy:
      # Each OS's leg runs to the end: the three toolchains fail for different reasons, and one red leg
      # cancelling the others hides the macOS/Windows problems until the next run.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: windows-latest, platform: win, arch: x64 }
          - { os: macos-15, platform: mac, arch: arm64 }
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The hosted Linux image ships toolchains this job never uses; the GPUI build and its test binaries need the room.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - name: Free disk space (macOS)
        if: runner.os == 'macOS'
        run: |
          df -h /
          keep="$(cd "$(xcode-select -p)/../.." && pwd -P)"  # the real app, also when Xcode.app is a link to it
          for app in /Applications/Xcode*.app; do
            if [ ! -L "$app" ] && [ "$(cd "$app" && pwd -P)" != "$keep" ]; then sudo rm -rf "$app"; fi
          done
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet "$HOME/.dotnet" "$HOME/Library/Developer/CoreSimulator/Caches"
          df -h /
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # dilla-client's route-table test runs scripts that import the typescript package.
      - run: npm ci
      # dilla-client's real-server tests start dilla-testhost (Go) on the WASI core, so every OS builds both below.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Download Go modules (retried only on known network errors)
        run: node scripts/retry-on.mjs --pattern 'proxy\.golang\.org[^\n]*:\s(50[0-4]|429)\b|stream error|INTERNAL_ERROR|TLS handshake timeout|connection reset|i/o timeout' -- go mod download
      # GPUI's Linux build and the libwebrtc behind LiveKit need the X11, Wayland, xkbcommon, font, Vulkan and GBM
      # development packages and libclang (bindgen). mesa-vulkan-drivers is lavapipe, the software Vulkan adapter
      # dilla-parity's headless screenshot test renders on. ffmpeg (with libopus) makes the Bot's music fixtures and plays
      # them for dilla-media's Bot music timing tests (testing::host::music, as e2e/media/support/fixtures.ts does).
      # Retried only on mirror and DNS failures.
      # LiveKit's prebuilt libwebrtc on Windows links the static MSVC runtime (/MT); a dynamic-CRT Rust build gets
      # LNK2005/LNK1169 duplicate std symbols. .cargo/config.toml may not carry rustflags (workspace_policy), so the
      # Windows leg sets it here; local Windows builds need the same (documented in clients/desktop/README).
      - name: Static MSVC runtime for libwebrtc (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      # LiveKit's prebuilt libwebrtc ships a hermetic libc++ that needs clang 21+; ubuntu-24.04 has clang 18.
      # LLVM's own apt repository, verified by its signing key.
      - name: Add the LLVM 21 apt repository
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 5 --retry-all-errors https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      - name: Install the GPUI build dependencies
        if: runner.os == 'Linux'
        env:
          DILLA_APT_FETCH_TIMEOUT: '600'
        run: >-
          node scripts/retry-on.mjs --attempts 5 --wait 10
          --pattern 'Temporary failure resolving|Could not resolve|Failed to fetch|Unable to fetch'
          -- bash scripts/ci-apt-install.sh
          clang-21 libclang-21-dev pkg-config libssl-dev libdbus-1-dev libasound2-dev
          libfontconfig-dev libfreetype-dev libvulkan-dev libgbm-dev libdrm-dev libglib2.0-dev
          libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libpipewire-0.3-dev
          mesa-vulkan-drivers libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxext-dev libxdamage-dev
          libxfixes-dev libxcomposite-dev libxrandr-dev ffmpeg
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-gpui-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # Token freshness: the generated Rust tokens match the design tokens they come from.
      - run: node --test scripts/gen-gpui-tokens.test.mjs
      # Strings freshness: dilla-desktop's generated strings.rs matches packages/web/src/strings/*.ts.
      - run: node --test scripts/gen-gpui-strings.test.mjs
      # Behaviour gates: every e2e test title has a row in clients/desktop/BEHAVIOUR-GATES.md (behaviour_gate_table_complete).
      - run: node --test scripts/behaviour-gates.test.mjs
      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # The test host and the WASI core dilla-client's real-server tests start (all read DILLA_CORE_WASI).
      # The WASI core is rebuilt here on purpose, not taken from internal/mlswasi/testdata (git-ignored, absent on a fresh
      # checkout): the client under test and the server it talks to must be the core of this very commit.
      - name: Build the test host and the WASI core
        shell: bash
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          cargo build -p dilla-core-wasi --target wasm32-wasip1 --release --locked
          go build -o "target/dilla-testhost$exe" ./cmd/dilla-testhost
          {
            echo "DILLA_TESTHOST=$GITHUB_WORKSPACE/target/dilla-testhost$exe"
            echo "DILLA_CORE_WASI=$GITHUB_WORKSPACE/target/wasm32-wasip1/release/dilla_core_wasi.wasm"
          } >> "$GITHUB_ENV"
      - run: cargo build $GPUI_CRATES --all-targets --locked
        shell: bash
      - run: cargo clippy $GPUI_CRATES --all-targets --locked --keep-going -- -D warnings  # every crate's lints in one run
        shell: bash
      # The window test runs on GPUI's test platform, so it needs no display.
      - run: cargo test $GPUI_CRATES --locked --no-fail-fast  # every OS reports all its failing test binaries in one run
        shell: bash
      # The macOS call tests open a real CoreAudio unit (the app's voice join). D-D: the runner's own default input and
      # output when it has them (macos-15 had "Apple Virtual Sound Device" in every spike run, 2026-11-16), else
      # BlackHole 2ch, pinned by SHA-256 (the Null Audio Device is intermittently missing, runner-images #13668;
      # BlackHole and a coreaudiod restart, #11746).
      - name: A sound device for the call tests (macOS)
        if: runner.os == 'macOS' && !cancelled()
        shell: bash
        env:
          BLACKHOLE_URL: https://existential.audio/downloads/BlackHole2ch-0.7.1.pkg
          BLACKHOLE_SHA256: 57b540f27a3e29c37e310e01bee0fdfab76733087e47f997ef9dccf851400dcf
        run: |
          swiftc -O scripts/mac-audio-devices.swift -o "$RUNNER_TEMP/mac-audio-devices"
          both() { grep -q '^default-input ' <<<"$1" && grep -q '^default-output ' <<<"$1"; }
          list="$("$RUNNER_TEMP/mac-audio-devices")"
          echo "$list"
          if both "$list"; then echo "the runner's own sound devices"; exit 0; fi
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/BlackHole2ch.pkg" "$BLACKHOLE_URL"
          printf '%s  %s\n' "$BLACKHOLE_SHA256" "$RUNNER_TEMP/BlackHole2ch.pkg" | shasum -a 256 -c
          sudo installer -pkg "$RUNNER_TEMP/BlackHole2ch.pkg" -target /
          sudo killall coreaudiod
          deadline=$((SECONDS + 20))
          until both "$list"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "$list"
              echo "::error::no default CoreAudio input and output 20 s after installing BlackHole 2ch"
              exit 1
            fi
            sleep 1
            list="$("$RUNNER_TEMP/mac-audio-devices")"
          done
          echo "$list"
          echo "BlackHole 2ch"
      # dilla's real-server call tests on macOS, against the dilla-testhost built above: one suite per line, so a failure
      # names its suite, and one at a time, so two suites never contend for the one CoreAudio device. They include the
      # wss:// room joins (two_clients_join_see_and_hear_in_a_wss_room, the_app_joins_a_wss_room: the Mac's "Could not join
      # voice" of 2026-11-16) and a real ScreenCaptureKit share between two clients (a_real_display_share_reaches_a_viewer;
      # the shell holds Screen Recording on the runner). The rest of the ignored suites, the web peer's call test and the
      # Bot suites stay on Linux (gpui-linux): dillabot builds for Linux only (cmd/dillabot/main.go).
      # Report-only while the suite's first macOS timing failures are fixed (Jonas, 2026-11-16): a failure shows in the
      # job but does not fail the leg. Blocking again once it has been green for a week.
      - name: Run the call tests (macOS)
        if: runner.os == 'macOS' && env.TIER != 'pr' && !cancelled()
        continue-on-error: true
        shell: bash
        run: |
          cargo test -p dilla-client --test gateway --test http_sign_in --test calls --locked -- --ignored
          cargo test -p dilla-client --test voice --test ring --locked -- --ignored
          cargo build -p dilla-testkit --bin dilla-testkit --locked
          cargo test -p dilla-client --test dms --locked -- --ignored
          cargo test -p dilla-media --test live --test e2e_call --test capture --locked -- --ignored
          cargo test -p dilla-desktop --test voice --test ring --locked -- --ignored --skip parity_
      # The macOS CI plan, Task 3 (decision D-A): every parity screen and the video player through Metal, against the
      # Linux web references under the [macos] tolerances measured on macos-15 (parity/TOLERANCES.md). The plain run
      # above builds dilla-desktop's test files without the automation interface, so they hold no test there.
      - name: Run the parity screens (macOS)
        if: runner.os == 'macOS' && env.TIER != 'pr' && !cancelled()
        shell: bash
        run: |
          cargo test -p dilla-desktop --features automation --locked --no-fail-fast parity_
          cargo test -p dilla-desktop --features automation --locked --test video_player_shot
      # VideoToolbox (webrtc-sys `dilla-video-toolbox`, off by default) crashed the decode test on macOS CI with SIGSEGV
      # (core/vendor/README.md): nightly and release tiers only, and red until that is fixed.
      - name: Decode with VideoToolbox (macOS)
        if: runner.os == 'macOS' && env.TIER != 'pr' && !cancelled()
        shell: bash
        run: cargo test -p dilla-desktop --features webrtc-sys/dilla-video-toolbox --locked --lib -- --exact screens::attachments::video::tests::every_inline_format_decodes_its_frames_in_presentation_order
      - name: sccache statistics
        if: always()
        run: sccache --show-stats
  # dilla's real-server, Bot, parity and call tests (the #[ignore]d ones a plain `cargo test` skips), Linux only, in four
  # parallel shards: one after another they took 50 minutes of a 76-minute job. Each shard builds what its tests need
  # on the gpui job's cache.
  gpui-linux:
    name: gpui-linux-x64-${{ matrix.shard }}
    needs: [same-tree]
    if: ${{ !cancelled() && needs.same-tree.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # Every shard runs to the end, so one red suite does not hide another's result.
      fail-fast: false
      matrix:
        # The Bot shard is absent from the matrix in the PR tier: no build and no test host, not a skip step by step.
        shard: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["client","bot","desktop","media"]' || '["client","desktop","media"]') }}
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Download Go modules (retried only on known network errors)
        run: node scripts/retry-on.mjs --pattern 'proxy\.golang\.org[^\n]*:\s(50[0-4]|429)\b|stream error|INTERNAL_ERROR|TLS handshake timeout|connection reset|i/o timeout' -- go mod download
      - name: Add the LLVM 21 apt repository
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 5 --retry-all-errors https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      - name: Install the GPUI build dependencies
        if: runner.os == 'Linux'
        env:
          DILLA_APT_FETCH_TIMEOUT: '600'
        run: >-
          node scripts/retry-on.mjs --attempts 5 --wait 10
          --pattern 'Temporary failure resolving|Could not resolve|Failed to fetch|Unable to fetch'
          -- bash scripts/ci-apt-install.sh
          clang-21 libclang-21-dev pkg-config libssl-dev libdbus-1-dev libasound2-dev
          libfontconfig-dev libfreetype-dev libvulkan-dev libgbm-dev libdrm-dev libglib2.0-dev
          libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libpipewire-0.3-dev
          mesa-vulkan-drivers libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxext-dev libxdamage-dev
          libxfixes-dev libxcomposite-dev libxrandr-dev ffmpeg
      # Restore only: the gpui job's Linux leg saves this cache.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-gpui-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # The test host and the WASI core dilla-client's real-server tests start (all read DILLA_CORE_WASI).
      # The WASI core is rebuilt here on purpose, not taken from internal/mlswasi/testdata (git-ignored, absent on a fresh
      # checkout): the client under test and the server it talks to must be the core of this very commit.
      - name: Build the test host and the WASI core
        shell: bash
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          cargo build -p dilla-core-wasi --target wasm32-wasip1 --release --locked
          go build -o "target/dilla-testhost$exe" ./cmd/dilla-testhost
          {
            echo "DILLA_TESTHOST=$GITHUB_WORKSPACE/target/dilla-testhost$exe"
            echo "DILLA_CORE_WASI=$GITHUB_WORKSPACE/target/wasm32-wasip1/release/dilla_core_wasi.wasm"
          } >> "$GITHUB_ENV"
      # dilla-media's live and web-interop call tests: dilla-testhost's in-process LiveKit SFU (no separate server), the
      # WASI core built above, packages/media's wasm and Playwright's Chromium (the e2e media suite's prerequisites).
      # The wasm C build (sqlite-wasm-rs) uses clang 23, as the browser jobs of desktop-ci.yml do.
      - id: clang23-cache
        if: runner.os == 'Linux' && !cancelled()
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/llvm-23-debs
          key: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-latest
          restore-keys: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-
      - id: clang23
        name: clang 23 for the wasm C build (Linux)
        if: runner.os == 'Linux' && !cancelled()
        run: bash scripts/ci-llvm.sh install
      - if: runner.os == 'Linux' && !cancelled() && steps.clang23.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/llvm-23-debs
          key: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-${{ steps.clang23.outputs.build }}
      - name: Build packages/media's wasm core (Linux)
        if: runner.os == 'Linux' && !cancelled()
        env:
          CC_wasm32_unknown_unknown: /usr/bin/clang-23
          AR_wasm32_unknown_unknown: /usr/bin/llvm-ar-23
        run: |
          bash scripts/install-ci-tool.sh wasm-bindgen
          bash scripts/install-ci-tool.sh wasm-pack
          bash scripts/install-ci-tool.sh binaryen
          export PATH="$RUNNER_TEMP/dilla-ci-tools:$PATH"
          wasm-pack build core/dilla-core-wasm --target web --profile wasm-release --mode no-install --out-dir ../../packages/media/wasm
      # The runner has no sound card, and a call's media opens the default speaker (dilla-media's Speaker): without one
      # the desktop's join fails (MediaFailed) and the call tests' peer never sees the other in the call. ALSA's null
      # device stands in, for the ignored-tests step only (its ALSA_CONFIG_PATH): it never paces, so a Chromium
      # AudioContext on it never renders, and the media call tests' page must keep Chromium's own fake output (the
      # one it takes with no sound device at all). The media call tests' web peer (e2e/media/support/testhost.ts)
      # reads the WASI core from internal/mlswasi/testdata, which is git-ignored: the core built above goes there.
      - name: A null sound card and the WASI core for the call tests (Linux)
        if: runner.os == 'Linux' && !cancelled()
        shell: bash
        run: |
          printf 'pcm.!default {\n  type null\n}\n' > "$RUNNER_TEMP/asound-null.conf"
          mkdir -p internal/mlswasi/testdata
          cp target/wasm32-wasip1/release/dilla_core_wasi.wasm internal/mlswasi/testdata/
      # Chromium for the media tests and for dilla-parity's web shooter (parity/shoot.mjs).
      - name: Playwright Chromium (Linux)
        if: runner.os == 'Linux' && !cancelled()
        timeout-minutes: 8
        # --with-deps runs apt-get update over the apt.llvm.org source added above, which can be briefly unreachable.
        run: >-
          node scripts/retry-on.mjs --attempts 4 --wait 30
          --pattern 'Temporary failure resolving|Could not resolve|Failed to fetch|Unable to fetch|Network is unreachable|no longer has a Release file'
          -- npx playwright install --with-deps chromium
      # dilla-parity's only GPU test is #[ignore]d (release build has no automation, ~4 min), so the plain run above
      # needs no adapter on any OS: macOS would use Metal and Windows has none, and neither runs the ignored test.
      # Linux renders on lavapipe (mesa-vulkan-drivers, installed above) and runs it, plus dilla-client's real-dillad
      # hello (it starts the dilla-testhost built above).
      # dilla's real Bot for the Bot tests (dilla-client tests/bot*, dilla-desktop tests/bot): dilla-testhost -bot supervises
      # this dillabot (the dilla_testhost tag lets it read its music fixtures from its state directory) and its helper.
      - name: Build the Bot for the Bot tests (Linux)
        if: runner.os == 'Linux' && !cancelled()
        shell: bash
        run: |
          go build -tags dilla_testhost -o target/dillabot ./cmd/dillabot
          cargo build -p dilla-bot-core --release --locked
      - name: Run the ignored tests (Linux, client)
        if: matrix.shard == 'client' && !cancelled()
        shell: bash
        run: |
          export ALSA_CONFIG_PATH="$RUNNER_TEMP/asound-null.conf"
          cargo test -p dilla-client --test gateway --locked -- --ignored
          cargo test -p dilla-client --test sync --locked -- --ignored
          cargo test -p dilla-client --test http_sign_in --locked -- --ignored
          cargo test -p dilla-client --test calls --locked -- --ignored
          cargo test -p dilla-client --test removals --test keypackages --test backups --test lifecycle --test readmit --test send_after_new_device --locked -- --ignored
          cargo test -p dilla-client --test notify --locked -- --ignored
          cargo build -p dilla-testkit --bin dilla-testkit --locked
          cargo test -p dilla-client --test dms --locked -- --ignored
          cargo test -p dilla-client --test voice --locked -- --ignored
          cargo test -p dilla-client --test ring --locked -- --ignored
      - name: Run the ignored tests (Linux, Bot)
        if: matrix.shard == 'bot' && !cancelled()
        shell: bash
        run: |
          export ALSA_CONFIG_PATH="$RUNNER_TEMP/asound-null.conf"
          cargo test -p dilla-client --test attachments --test bot --test bot_admin --test diagnostics --test factors --test members --test messages --test onboarding --test reactions --test search --test server_settings --test threads --test user_settings --test voice_settings --locked -- --ignored --skip enter_to_first_answer_is_within_rtt_plus_100ms_at_p95
          # G2 is a latency budget: measured alone, not beside the other Bot tests' instances on the same four cores.
          cargo test -p dilla-client --test bot --locked -- --ignored --exact enter_to_first_answer_is_within_rtt_plus_100ms_at_p95
          cargo clippy -p dilla-desktop --all-targets --features automation --locked -- -D warnings
          cargo test -p dilla-desktop --features automation --locked
          cargo test -p dilla-desktop --features automation --test a11y --test bot --test bot_admin --test members --test search --test server_settings --test settings_host --test shell --test sign_in --test user_settings --test voice_settings --locked -- --ignored --skip parity_
      - name: Run the ignored tests (Linux, desktop)
        if: matrix.shard == 'desktop' && !cancelled()
        shell: bash
        run: |
          export ALSA_CONFIG_PATH="$RUNNER_TEMP/asound-null.conf"
          cargo test -p dilla-parity --locked -- --ignored
          cargo test -p dilla-desktop --test attachments --test diagnostics --test factors --test instances --test members --test messages --test notify --test onboarding --test reactions --test search --test server_settings --test share --test shell --test threads --test user_settings --test voice --test voice_settings --locked -- --ignored --skip parity_
          cargo test -p dilla-desktop --test integration --locked -- --ignored
          cargo test -p dilla-desktop --test slice --locked -- --ignored
      # tests/call includes the Bot music timing tests (G3): they start the Bot built above with its SFU and the ffmpeg fixtures.
      - name: Run the media call tests (Linux)
        if: matrix.shard == 'media' && !cancelled()
        shell: bash
        run: |
          cargo test -p dilla-media --test live --test call --test e2e_call --test capture --test app_audio --locked -- --ignored --skip bot_play_from_enter_to_first_audio_frame_meets_g3 --skip bot_next_queued_track_gap_is_under_150_ms --skip bot_repeated_track_starts_within_500_ms_at_p95 --skip a_new_device_uses_play_within_its_first_session
          # The Bot music timing tests (G3) are latency budgets: measured one at a time, not beside a Bot restart or a browser call.
          cargo test -p dilla-media --test call --locked -- --ignored --exact --test-threads=1 bot_play_from_enter_to_first_audio_frame_meets_g3 bot_next_queued_track_gap_is_under_150_ms bot_repeated_track_starts_within_500_ms_at_p95 a_new_device_uses_play_within_its_first_session
      - name: sccache statistics
        if: always()
        run: sccache --show-stats
  # The macOS bundle, unsigned (no secrets in a PR): the release binary goes through scripts/desktop-gpui-package-mac.sh,
  # which signs ad hoc without CSC_LINK, and the DMG is opened and the app inside it run. The signed and notarized build
  # is desktop-gpui-sign.yml's (release plan, Tasks 12 and 14); this proves the bundle's shape on every PR.
  gpui-mac-package:
    name: gpui-mac-package
    needs: [same-tree]
    if: ${{ !cancelled() && needs.same-tree.outputs.skip != 'true' }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free disk space (macOS)
        run: |
          df -h /
          keep="$(cd "$(xcode-select -p)/../.." && pwd -P)"  # the real app, also when Xcode.app is a link to it
          for app in /Applications/Xcode*.app; do
            if [ ! -L "$app" ] && [ "$(cd "$app" && pwd -P)" != "$keep" ]; then sudo rm -rf "$app"; fi
          done
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet "$HOME/.dotnet" "$HOME/Library/Developer/CoreSimulator/Caches"
          df -h /
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: rustup show active-toolchain
      # Restore only: the gpui job's macOS leg saves this cache (a release build differs in profile only, so the
      # registry is a warm start at best, never a correctness input).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-gpui-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # Without gpui-pre-macos's `font-kit` the app gets GPUI's NoopTextSystem and draws no text at all, silently
      # (the dilla-MacBook check of #174). A window can't be shot here, so the feature itself is checked.
      - name: The macOS text system is compiled in
        shell: bash
        run: |
          cargo tree -p dilla-desktop --locked -e features -i gpui-pre-macos > "$RUNNER_TEMP/macos-features.txt"
          grep -q 'gpui-pre-macos feature "font-kit"' "$RUNNER_TEMP/macos-features.txt" || { cat "$RUNNER_TEMP/macos-features.txt"; echo "::error::gpui-pre-macos is built without font-kit: no text would be drawn"; exit 1; }
      - name: Build the release binary
        run: cargo build -p dilla-desktop --release --locked
      - name: Package Dilla.app and the DMG (ad hoc)
        shell: bash
        run: |
          df -h /  # after the release build (the DMG step once failed with "No space left": hdiutil's own sizing)
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' clients/desktop/dilla-desktop/Cargo.toml | head -n 1)"
          [ -n "$version" ]
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # The licence-bundle branch the release takes (desktop-gpui-sign.yml sets DILLA_WEBRTC_LICENSE), under macOS's
          # bash 3.2: alpha.1's first signed build died there on an empty array that only bash 3.2 calls unbound. A
          # stand-in licence: this ad hoc bundle is never shipped.
          printf 'stand-in for libwebrtc LICENSE.md (PR build)\n' > "$RUNNER_TEMP/libwebrtc-LICENSE.md"
          DILLA_WEBRTC_LICENSE="$RUNNER_TEMP/libwebrtc-LICENSE.md" \
            bash scripts/desktop-gpui-package-mac.sh "$version" target/release/dilla-desktop "$RUNNER_TEMP/mac-dist"
      - name: Open the DMG and run the app
        shell: bash
        run: |
          mount="$RUNNER_TEMP/dilla-dmg"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$RUNNER_TEMP/mac-dist/dilla-$VERSION-mac-arm64.dmg"
          app="$mount/Dilla.app"
          ls -l "$app/Contents" "$app/Contents/MacOS"
          out="$("$app/Contents/MacOS/dilla-desktop" --version)"
          echo "$out"
          [[ "$out" == "Dilla $VERSION ("* ]]
          codesign -dv --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q 'Identifier=dev.dilla.desktop' "$RUNNER_TEMP/codesign.txt"
          grep -q 'flags=.*runtime' "$RUNNER_TEMP/codesign.txt"
          codesign -d --entitlements - "$app" 2>&1 | grep -q 'com.apple.security.device.audio-input'
          plutil -lint "$app/Contents/Info.plist"
          plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist" | grep -qx 'dev.dilla.desktop'
          plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist" | grep -qx 'dilla-desktop'
          plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist" | grep -qx '13.0'
          plutil -extract CFBundleURLTypes xml1 -o - "$app/Contents/Info.plist" | grep -q '<string>dilla</string>'
          plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "$app/Contents/Info.plist" | grep -qx 'dilla'
          plutil -extract NSMicrophoneUsageDescription raw "$app/Contents/Info.plist"
          plutil -extract NSCameraUsageDescription raw "$app/Contents/Info.plist"
          plutil -lint clients/desktop/packaging/macos/entitlements.plist
          # The full licence bundle (desktop-third-party.mjs), as a release ships it.
          ls "$app/Contents/Resources/licenses"
          test -f "$app/Contents/Resources/licenses/libwebrtc-LICENSE.md"
          hdiutil detach "$mount"
      - name: The updater's zip holds the same app
        shell: bash
        run: |
          unzip -q "$RUNNER_TEMP/mac-dist/dilla-$VERSION-mac-arm64.zip" -d "$RUNNER_TEMP/zip-check"
          codesign --verify --strict "$RUNNER_TEMP/zip-check/Dilla.app"
          "$RUNNER_TEMP/zip-check/Dilla.app/Contents/MacOS/dilla-desktop" --version
      # Layer 3 (plan 2026-11-16-gpui-macos-ci, Task 5): the zip's app (the updater's bundle, writable; the DMG mount is
      # read-only and detached) opened and driven through System Events and real clicks: the window's text
      # (screencapture + Vision OCR), its AX tree, the traffic lights, the log file, the app menu and its shortcuts, ⌘Q,
      # one process for `open -n` and dilla://, the autostart LaunchAgent and the tray. Every wait has a deadline. The
      # checks after connect (--connected: two profiles on a local https host) follow in their own change.
      - name: Drive the packaged app (macOS UI)
        timeout-minutes: 30  # a hung helper must not hold a macOS slot until the job timeout
        shell: bash
        run: bash scripts/desktop-gpui-mac-ui.sh "$RUNNER_TEMP/zip-check/Dilla.app" "$RUNNER_TEMP/mac-ui"
      - name: Stop the packaged app
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if pgrep -f Dilla.app/Contents/MacOS/dilla-desktop; then pkill -9 -f Dilla.app/Contents/MacOS/dilla-desktop; fi
          rm -f "$HOME/Library/LaunchAgents/dev.dilla.desktop.plist"
      - name: Upload the macOS UI shots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gpui-mac-ui
          path: ${{ runner.temp }}/mac-ui
          if-no-files-found: error
      - name: sccache statistics
        if: always()
        run: sccache --show-stats
  # The Windows installer (GPUI release plan, Task 13, D10), built and exercised on a clean windows-latest runner, keyless:
  # beta.5's NSIS installer goes on first (pinned by SHA-256), then the new setup takes it over silently; the release
  # binary is the static-CRT build the plan names. Independent of the gpui jobs' results.
  gpui-win-package:
    name: gpui-win-package
    needs: [same-tree]
    if: ${{ !cancelled() && needs.same-tree.outputs.skip != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 120  # a cold release build with the static CRT
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      CARGO_INCREMENTAL: '0'
      BETA5_WIN_SHA256: 0cf2c3ad5c94b9cd4aa21956e6d37209dafe06fa525fcd7866240379fadcf1bb
      # electron-builder's uninstall key for appId dev.dilla.desktop (UUID v5; scripts/desktop-gpui-package-win.test.mjs).
      BETA5_UNINSTALL_GUID: f6db60e4-10df-5b69-9206-408d5f2cebe9
      DILLA_INNO_APP_ID: '{6F0A3C1E-5D2B-4B7A-9E43-1C8D2A7B5F10}_is1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/desktop-gpui-package-win.test.mjs
      - run: rustup show active-toolchain
      # LiveKit's prebuilt libwebrtc on Windows links the static MSVC runtime (/MT); the shipped binary is built the same way.
      - name: Static MSVC runtime
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      # The release's libwebrtc, pinned by SHA-256 (fetch-libwebrtc.sh): it also supplies the licence the bundle ships.
      - name: Fetch the pinned libwebrtc
        shell: bash
        run: |
          line=$(bash scripts/fetch-libwebrtc.sh x86_64-pc-windows-msvc "$RUNNER_TEMP/libwebrtc")
          echo "LK_CUSTOM_WEBRTC=$(cygpath -m "${line#LK_CUSTOM_WEBRTC=}")" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-gpui-win-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # beta.5's Windows installer, from its release, checked against its pinned SHA-256.
      - name: Download beta.5's installer
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "https://github.com/dilla-chat/dilla/releases/download/desktop-v0.1.0-beta.5/dilla-0.1.0-beta.5-win-x64.exe" \
            -o "$RUNNER_TEMP/dilla-0.1.0-beta.5-win-x64.exe"
          printf '%s  %s\n' "$BETA5_WIN_SHA256" "$RUNNER_TEMP/dilla-0.1.0-beta.5-win-x64.exe" | sha256sum --check --strict
      # Wait-Process on the installer alone: beta.5 may start the app it installed, which Start-Process -Wait would also wait for.
      - name: Install beta.5 (silent)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\dilla-0.1.0-beta.5-win-x64.exe" -ArgumentList '/S' -PassThru
          Wait-Process -Id $p.Id -Timeout 600
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:BETA5_UNINSTALL_GUID"
          if (-not (Test-Path $key)) { throw "beta.5's uninstall entry $key is not there: electron-builder's GUID for dev.dilla.desktop is wrong" }
          $entry = Get-ItemProperty $key
          Write-Host "DisplayName=$($entry.DisplayName) DisplayVersion=$($entry.DisplayVersion) UninstallString=$($entry.UninstallString)"
          if ($entry.DisplayVersion -ne '0.1.0-beta.5') { throw "expected beta.5, found $($entry.DisplayVersion)" }
          # beta.5 installs where electron-builder put it (%LOCALAPPDATA%\Programs\@dilladesktop, from the package name),
          # not where the new setup installs: read it from the uninstall entry, as dilla.iss does.
          $beta5 = (Get-ItemProperty "HKCU:\Software\$env:BETA5_UNINSTALL_GUID" -ErrorAction SilentlyContinue).InstallLocation
          if (-not $beta5) { $beta5 = Split-Path ($entry.UninstallString -replace '^"([^"]+)".*$', '$1') }
          Write-Host "beta.5 is installed in $beta5"
          if (-not (Get-ChildItem -Path $beta5 -Filter *.exe)) { throw "beta.5's install folder $beta5 has no program" }
          echo "BETA5_DIR=$beta5" >> $env:GITHUB_ENV
          # The user data beta.5 keeps (deleteAppDataOnUninstall: false) must outlive the takeover.
          $data = Join-Path $env:APPDATA 'Dilla'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          Set-Content -Path (Join-Path $data 'takeover-sentinel.txt') -Value 'kept'
      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Build the release binary (static CRT)
        shell: bash
        run: cargo build -p dilla-desktop --release --locked
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path clients/desktop/dilla-desktop/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "DILLA_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          & scripts/desktop-gpui-package-win.ps1 -Version $version -Binary target/release/dilla-desktop.exe -OutDir dist
      # The plan's own check, independent of the script's: no Visual C++ redistributable runtime.
      - name: No VCRUNTIME140.dll in the binary's dependents
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $dumpbin = & $vswhere -latest -products '*' -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | Select-Object -First 1
          $out = & $dumpbin /dependents target/release/dilla-desktop.exe
          $out | ForEach-Object { Write-Host $_ }
          if ($out -match 'VCRUNTIME140') { throw 'dilla-desktop.exe needs VCRUNTIME140.dll: the CRT is not static' }
      - name: Setup over beta.5 (silent)
        shell: pwsh
        run: |
          $setup = "dist/dilla-$env:DILLA_VERSION-win-x64-setup.exe"
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log" -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }
      - name: beta.5 is gone, its data kept, the app runs
        shell: pwsh
        run: |
          $uninstall = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          if (Test-Path "$uninstall\$env:BETA5_UNINSTALL_GUID") { throw "beta.5's uninstall entry is still there" }
          if (Test-Path "HKCU:\Software\$env:BETA5_UNINSTALL_GUID") { throw "beta.5's install-location key is still there" }
          if (-not (Test-Path -LiteralPath "$uninstall\$env:DILLA_INNO_APP_ID")) { throw 'the new uninstall entry is missing' }
          $sentinel = Join-Path $env:APPDATA 'Dilla\takeover-sentinel.txt'
          if (-not (Test-Path $sentinel)) { throw "$sentinel is gone: the takeover deleted beta.5's user data" }
          if ((Test-Path -LiteralPath $env:BETA5_DIR) -and (Get-ChildItem -LiteralPath $env:BETA5_DIR -Recurse -File)) { throw "beta.5's files are left in $env:BETA5_DIR" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Dilla'
          $exe = Join-Path $dir 'dilla-desktop.exe'
          if (Test-Path (Join-Path $dir 'Uninstall Dilla.exe')) { throw "beta.5's uninstaller is left in $dir" }
          foreach ($left in 'resources', 'locales', 'Dilla.exe') {
            if (Test-Path (Join-Path $dir $left)) { throw "an Electron file is left in ${dir}: $left" }
          }
          $reported = (& $exe --version) -join "`n"
          Write-Host $reported
          if ($LASTEXITCODE -ne 0 -or $reported -notmatch "^Dilla $([regex]::Escape($env:DILLA_VERSION)) ") { throw "dilla-desktop.exe --version said '$reported'" }
          if (-not (Test-Path (Join-Path $dir 'licenses/THIRD-PARTY.md'))) { throw 'the licence bundle is not installed' }
          # The Start-menu shortcut carries the app's AppUserModelID.
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Dilla.lnk'
          if (-not (Test-Path $lnk)) { throw "$lnk is missing" }
          $item = (New-Object -ComObject Shell.Application).NameSpace((Split-Path $lnk)).ParseName((Split-Path $lnk -Leaf))
          $aumid = $item.ExtendedProperty('System.AppUserModel.ID')
          if ($aumid -ne 'dev.dilla.desktop') { throw "the shortcut's AppUserModelID is '$aumid'" }
          # The dilla: scheme (HKCU\Software\Classes\dilla), beta.5's registration: the app takes the link as its argument.
          $scheme = Get-Item 'HKCU:\Software\Classes\dilla' -ErrorAction SilentlyContinue
          if (-not $scheme) { throw 'the dilla: protocol is not registered' }
          if ($null -eq $scheme.GetValue('URL Protocol')) { throw 'the dilla: key has no URL Protocol value' }
          $command = (Get-ItemProperty 'HKCU:\Software\Classes\dilla\shell\open\command').'(default)'
          if ($command -ne "`"$exe`" `"%1`"") { throw "the dilla: open command is '$command'" }
          if (-not (Test-Path 'HKCU:\Software\Classes\dilla\DefaultIcon')) { throw 'the dilla: key has no DefaultIcon' }
      - name: Silent uninstall leaves no program files
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Dilla'
          $p = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the uninstaller exited with $($p.ExitCode)" }
          # Inno's uninstaller finishes in a copy of itself; wait for the folder to go.
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $dir) { throw "program files are left: $((Get-ChildItem -Recurse -Force $dir).FullName -join ', ')" }
          if (Test-Path -LiteralPath "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:DILLA_INNO_APP_ID") { throw 'the uninstall entry is left' }
          if (Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Dilla.lnk')) { throw 'the Start-menu shortcut is left' }
          if (Test-Path 'HKCU:\Software\Classes\dilla') { throw 'the dilla: protocol registration is left' }
          if (-not (Test-Path (Join-Path $env:APPDATA 'Dilla\takeover-sentinel.txt'))) { throw 'the uninstall deleted user data' }
      - name: sccache statistics
        if: always()
        run: sccache --show-stats
  # A red nightly opens the one tracking issue (a second comments on it), a green one closes it; the release gate refuses while it is open.
  # It runs only in the nightly tier (the job `if` cannot read `env`, so it repeats TIER's schedule/dispatch test) and after every other job.
  nightly-report:
    needs: [check-tree, same-tree, gpui, gpui-linux, gpui-mac-package, gpui-win-package]
    if: "!cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'nightly'))"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # issues: write is this job's only grant; contents: read is the workflow's own, which the checkout needs.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/ci-nightly-issue.mjs
          sparse-checkout-cone-mode: false
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci-nightly-issue.mjs --needs $NEEDS_RESULTS -- "$RUN_URL"
