name: desktop foundations
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: windows-latest, platform: win, arch: x64 }
          - { os: macos-15-intel, platform: mac, arch: x64 }
          - { os: macos-15, platform: mac, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-web-dist
          path: packages/web/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-desktop-core
          path: packages/core-wasm/pkg
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev pipewire wireplumber
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test -w @dilla/desktop
      - run: npm run typecheck -w @dilla/desktop
      - id: desktop-build
        run: npm run build -w @dilla/desktop -- --existing-client
      - run: npm run build:validation -w @dilla/desktop
      - name: Installed unsigned Sparkle upgrade and signed-feed rejection
        if: runner.os == 'macOS'
        run: node --test packages/desktop/test/native/mac-upgrade.test.mjs
      - name: Linux display and Chromium sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox x11-utils dbus-x11 libgbm1 libnss3 libasound2t64
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - if: runner.os == 'Linux'
        run: npm run test:native:linux -w @dilla/desktop
      - if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- bash packages/desktop/scripts/with-window-manager.sh npm run test:electron -w @dilla/desktop -- --grep-invert "application-audio.spec.ts"
      - if: runner.os != 'Linux'
        run: npm run test:electron -w @dilla/desktop -- --grep-invert "application-audio.spec.ts"
      - name: Prepare Windows audio services and verify a real endpoint
        if: runner.os == 'Windows'
        run: ./packages/desktop/scripts/prepare-windows-audio.ps1
      - name: Record macOS audio hardware for capture acceptance
        if: runner.os == 'macOS'
        run: system_profiler SPAudioDataType
      - name: Application audio encryption and exclusion
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- bash packages/desktop/scripts/with-window-manager.sh npm exec -w @dilla/desktop -- playwright test --config playwright.config.ts application-audio.spec.ts
      - name: Application audio encryption and exclusion
        if: runner.os != 'Linux'
        run: npm exec -w @dilla/desktop -- playwright test --config playwright.config.ts application-audio.spec.ts
      - run: npm run pack -w @dilla/desktop -- --config.electronDist=../../node_modules/electron/dist --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_FOR_PULL_REQUEST: 'true' # Only the configured ad-hoc identity; no commercial signing credentials.
      - run: node packages/desktop/scripts/check-fuses.mjs
      - name: Build installable desktop artifacts
        run: npm run dist -w @dilla/desktop -- --config.electronDist=../../node_modules/electron/dist --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_FOR_PULL_REQUEST: 'true' # Ad-hoc Mac signing only; no private release keys in CI.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            packages/desktop/out/*.AppImage
            packages/desktop/out/*.exe
            packages/desktop/out/*.dmg
            packages/desktop/out/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-validation-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/desktop/test-report
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-failure-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/desktop/test-results
          if-no-files-found: error

  client:
    name: desktop-client-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        os: [ubuntu-24.04, windows-latest, macos-15-intel, macos-15]
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: windows-latest, platform: win, arch: x64 }
          - { os: macos-15-intel, platform: mac, arch: x64 }
          - { os: macos-15, platform: mac, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-client-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: rustup show active-toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-web-dist
          path: packages/web/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-desktop-core
          path: packages/core-wasm/pkg
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-wasi
          path: internal/mlswasi/testdata
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev pipewire wireplumber xvfb openbox x11-utils dbus-x11 libgbm1 libnss3 libasound2t64
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Test-host directory locks retain shared and exclusive semantics
        run: go test ./internal/ops -run 'Lock|BackupAndServe|ServeAdmits'
      - run: npm exec -w @dilla/e2e -- playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: node packages/desktop/scripts/prepare-browser-sandbox.mjs
      - run: cargo build -p dilla-testkit --release --locked
      - run: npm run build -w @dilla/desktop -- --existing-client
      - if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Shared client end-to-end coverage in Electron
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- bash packages/desktop/scripts/with-window-manager.sh npm exec -w @dilla/e2e -- playwright test --config playwright.desktop.config.ts --project=electron-client --shard=${{ matrix.shard }}/3 --max-failures=3
      - name: Shared client end-to-end coverage in Electron
        if: runner.os != 'Linux'
        run: npm exec -w @dilla/e2e -- playwright test --config playwright.desktop.config.ts --project=electron-client --shard=${{ matrix.shard }}/3 --max-failures=3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-client-failure-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.shard }}
          path: |
            e2e/desktop-client-results
            e2e/desktop-client-report
          if-no-files-found: error

  voice:
    name: desktop-voice-${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15-intel, macos-15]
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: windows-latest, platform: win, arch: x64 }
          - { os: macos-15-intel, platform: mac, arch: x64 }
          - { os: macos-15, platform: mac, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-voice-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: rustup show active-toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-web-dist
          path: packages/web/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-desktop-core
          path: packages/core-wasm/pkg
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-wasi
          path: internal/mlswasi/testdata
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev pipewire wireplumber xvfb openbox x11-utils dbus-x11 libgbm1 libnss3 libasound2t64 dunst
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Test-host directory locks retain shared and exclusive semantics
        run: go test ./internal/ops -run 'Lock|BackupAndServe|ServeAdmits'
      - run: npm exec -w @dilla/e2e -- playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: node packages/desktop/scripts/prepare-browser-sandbox.mjs
      - run: cargo build -p dilla-testkit --release --locked
      - run: npm run build -w @dilla/desktop -- --existing-client
      - if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Desktop voice end-to-end coverage in Electron
        if: runner.os == 'Linux'
        env:
          DILLA_E2E_NOTIFICATIONS: '1'
        run: xvfb-run -a dbus-run-session -- bash packages/desktop/scripts/with-window-manager.sh npm exec -w @dilla/e2e -- playwright test --config playwright.desktop-voice.config.ts --project=electron-voice --workers=1 --max-failures=3
      - name: Desktop voice end-to-end coverage in Electron
        if: runner.os != 'Linux'
        run: npm exec -w @dilla/e2e -- playwright test --config playwright.desktop-voice.config.ts --project=electron-voice --workers=1 --max-failures=3
      - name: Desktop performance comparison
        if: runner.os == 'Linux'
        env:
          DILLA_E2E_NOTIFICATIONS: '1'
        run: xvfb-run -a dbus-run-session -- bash packages/desktop/scripts/with-window-manager.sh node packages/desktop/scripts/run-performance.mjs
      - name: Desktop performance comparison
        if: runner.os != 'Linux'
        run: node packages/desktop/scripts/run-performance.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-performance-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/desktop/test-report/performance-*.json
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-voice-failure-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            e2e/desktop-voice-results
            e2e/desktop-voice-report
            e2e/performance-results-browser
            e2e/performance-results-desktop
          if-no-files-found: error
