name: desktop release
on:
  push:
    tags: ['desktop-v*']
concurrency:
  group: desktop-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Authenticate version, source tree and main-branch tag
        id: plan
        run: node packages/desktop/scripts/publish-release.mjs plan
      - name: Fetch exact accepted installers without rebuilding them
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.plan.outputs.run }}
          repository: jonasthim/dilla
          pattern: desktop-installers-*
          merge-multiple: true
          path: desktop-release-artifacts
      - name: Verify and publish exact accepted bytes
        run: node packages/desktop/scripts/publish-release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
