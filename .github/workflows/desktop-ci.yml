name: desktop
on:
  push:
    branches: [main]
  pull_request:
  # Nightly on main with every area on, so test drift (a browser or runner update, a flaky lane) surfaces within a day.
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  # Runs independently of changes so the first failing root job is covered too. The write
  # token belongs only to trusted same-repository PRs, main pushes and scheduled runs (which GitHub starts on main); fork code never runs here.
  ci-watchdog:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/ci-watchdog.py
        env:
          GH_TOKEN: ${{ github.token }}
          # This workflow's roots and DAG barrier: the watcher is done once they and every other job completed.
          CI_COMPLETION_JOBS: changes desktop-work-complete

  # Decides which parts of the tree the change touches (scripts/ci-areas.mjs holds the path table and its tests) and
  # writes one output per area: go, core, web, e2e, text (the profile-text tables), mobile, and code for anything but docs. This
  # workflow and its sibling (server.yml) both run on every pull request and push to main, so both
  # ok checks always report. A pull request whose changed files all sit under docs/ or are *.md is docs-only: it runs
  # this job and workflow infrastructure; test/build jobs are skipped (a skipped job counts as passed for a
  # required check). A push to main, a scheduled run, and any diff that cannot be computed, turn every area on. Every other job carries
  # `needs: changes` and an `if:` on the outputs it depends on (JOB_GATES.desktop in scripts/ci-areas.mjs).
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.areas.outputs.go }}
      core: ${{ steps.areas.outputs.core }}
      web: ${{ steps.areas.outputs.web }}
      e2e: ${{ steps.areas.outputs.e2e }}
      text: ${{ steps.areas.outputs.text }}
      mobile: ${{ steps.areas.outputs.mobile }}
      code: ${{ steps.areas.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: areas
        run: node scripts/ci-areas.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # Heavy node gates. Any code change runs the script gates; `npm test` and the vectors check need the web or core areas.
  node:
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:css-check
      - run: npm run check:css
      - run: npm run test:bot-ops-check
      - run: npm run check:bot-ops
      - run: npm run check:desktop-auth
      - run: npm run test:ci-check
      - run: npm run test:wasm-size-check
      - run: npm run test:manifest-writer
      - if: needs.changes.outputs.web != 'false'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      # The Unicode inputs are cached under a key of the generator file, which holds their pinned checksums: they are
      # downloaded once per pin change. npm test's profile-tables check reads the same directory (DILLA_UCD_DIR), so
      # neither it nor the tables step below reaches unicode.org on a cache hit (PR #149: its 522s failed npm test).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.web != 'false' || needs.changes.outputs.text != 'false'
        with:
          path: ${{ runner.temp }}/ucd
          key: ucd-${{ hashFiles('scripts/gen-profile-text-tables.mjs') }}
      - if: needs.changes.outputs.web != 'false'
        run: npm test
        env:
          DILLA_UCD_DIR: ${{ runner.temp }}/ucd
      - name: vectors are up to date
        if: needs.changes.outputs.web != 'false'
        run: |
          [ ! -d packages ] || npm run vectors --workspaces --if-present
          git diff --exit-code -- protocol/vectors
          test -z "$(git status --porcelain -- protocol/vectors)"
      - name: profile-text tables are current
        if: needs.changes.outputs.text != 'false'
        run: node scripts/gen-profile-text-tables.mjs --download --check "$RUNNER_TEMP/ucd"

  ui:
    needs: [changes]
    if: needs.changes.outputs.web != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/design-tokens
      - run: git diff --exit-code -- packages/design-tokens/dist
      - run: npm test -w packages/design-tokens
      - run: npm test -w packages/ui
      - run: npm run typecheck -w packages/design-tokens
      - run: npm run typecheck -w packages/ui
      - id: apt-ui-key
        run: echo "suffix=$(bash scripts/ci-apt-cache.sh key)" >> "$GITHUB_OUTPUT"
      - id: apt-ui
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: apt-debs-${{ runner.arch }}-${{ steps.apt-ui-key.outputs.suffix }}-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            apt-debs-${{ runner.arch }}-${{ steps.apt-ui-key.outputs.suffix }}-chromium-
            apt-debs-${{ runner.arch }}-${{ steps.apt-ui-key.outputs.suffix }}-
      - run: bash scripts/ci-apt-cache.sh prepare
      - name: playwright install (chromium)
        timeout-minutes: 8
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: bash scripts/ci-apt-cache.sh stash
      - if: steps.apt-ui.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: ${{ steps.apt-ui.outputs.cache-primary-key }}
      - run: npm run build-storybook -w packages/ui
      - name: axe on every story
        run: |
          npx concurrently -k -s first -n SB,TEST \
            "npx http-server packages/ui/storybook-static --port 6006 --silent" \
            "npx wait-on tcp:127.0.0.1:6006 && npm run test:storybook -w packages/ui -- --url http://127.0.0.1:6006"
      # F16 (web-1, web-2a, web-2b): every story of the components and of the composed onboarding, sign-in, settings,
      # shell and conversation screens (titles Form/, Ceremony/, Shell/, Conversation/, Settings/, Screens/,
      # Primitives/ChannelRow; web-2b's toolbar, reactions, editor, reply chip, mention list, pins, tray, cards,
      # lightbox and Screens/Conversation among them) in mesh, light and high-contrast, for the founder's review:
      # three PNGs per story. The script fails when a prefix matches no story; the last three prefixes match only
      # web-2b stories (Conversation/MessageToolbar, Conversation/AttachmentCard, Screens/Conversation).
      - name: Screenshots of the web-1, web-2a and web-2b components and screens in the three themes
        run: node packages/ui/scripts/shoot-stories.mjs 6016 target/ui-screens/web-2b form- ceremony- shell- conversation- settings- screens- primitives-channelrow-- conversation-messagetoolbar-- conversation-attachmentcard-- screens-conversation--
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-screens
          path: target/ui-screens/web-2b
          if-no-files-found: error
      # L-CI-22 (web-2c): every story of the seven web-2c families (trust compare and alert, search palette, typing,
      # diagnostics, tab hand-over and Screens/TrustAndPolish) in the three themes, at 1280×800 and at an actual
      # 360×740 browser viewport. Each prefix matches only web-2c stories, so a missing or renamed story fails here.
      - run: node packages/ui/scripts/shoot-stories.mjs 6027 target/ui-screens/web-2c/desktop trust-safetycompare-- trust-trustalert-- search-searchpalette-- status-typingindicator-- settings-diagnosticspanel-- shell-tabhand-over-- screens-trustandpolish--
      - run: node packages/ui/scripts/shoot-stories.mjs 6027 target/ui-screens/web-2c/phone trust-safetycompare-- trust-trustalert-- search-searchpalette-- status-typingindicator-- settings-diagnosticspanel-- shell-tabhand-over-- screens-trustandpolish-- --viewport=360x740
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-screens-web-2c
          path: |
            target/ui-screens/web-2c/desktop/**
            target/ui-screens/web-2c/phone/**
          if-no-files-found: error
      # web-3 task 11: every story of the voice, ring and media-player families (Voice/, Media/MediaPlayer and
      # Screens/Voice) in the three themes, at 1280×800 and at an actual 360×740 browser viewport, uploaded as one
      # artifact from target/ui-screens/web-3. Each prefix matches only web-3 stories, so a missing family fails here.
      - run: node packages/ui/scripts/shoot-stories.mjs 6038 target/ui-screens/web-3/desktop voice- media-mediaplayer-- screens-voice--
      - run: node packages/ui/scripts/shoot-stories.mjs 6038 target/ui-screens/web-3/phone voice- media-mediaplayer-- screens-voice-- --viewport=360x740
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-screens-web-3
          path: target/ui-screens/web-3/**
          if-no-files-found: error

  rust-wasm-node:
    needs: [changes]
    if: needs.changes.outputs.web != 'false'
    runs-on: ubuntu-24.04
    # The wasm C build (sqlite-wasm-rs compiles SQLite3MC through cc) uses the dev box's LLVM 23.1 line:
    # the runner's own clang emits about 25 KB more wasm, so the D5 budget would not mean the same bytes here.
    env:
      CC_wasm32_unknown_unknown: /usr/bin/clang-23
      AR_wasm32_unknown_unknown: /usr/bin/llvm-ar-23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: clang23-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/llvm-23-debs
          key: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-latest
          restore-keys: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-
      - id: clang23
        name: clang 23 for the wasm C build
        run: bash scripts/ci-llvm.sh install
      - if: steps.clang23.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/llvm-23-debs
          key: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-${{ steps.clang23.outputs.build }}
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: bash scripts/install-ci-tool.sh wasm-bindgen
      - run: bash scripts/install-ci-tool.sh wasm-pack
      - run: bash scripts/install-ci-tool.sh binaryen
      - name: wasm-bindgen-cli must equal the Cargo.lock crate version
        run: |
          want=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
          have=$(wasm-bindgen --version | awk '{print $2}')
          test "$want" = "$have" || { echo "wasm-bindgen-cli $have != crate $want"; exit 1; }
      - run: cargo test -p dilla-core --target wasm32-unknown-unknown --locked --features vectors
      - run: cargo test -p dilla-core-wasm --target wasm32-unknown-unknown --locked --features vectors
      # Ruling 40: native clippy never compiles the wasm-only modules (store.rs, probe.rs, facade.rs).
      - run: cargo clippy -p dilla-core-wasm --target wasm32-unknown-unknown --lib --locked -- -D warnings
      - run: wasm-pack build core/dilla-core-wasm --target web --profile wasm-release --mode no-install --out-dir ../../packages/media/wasm
      - run: wasm-pack build core/dilla-core-wasm --target web --profile wasm-release --mode no-install --out-dir ../../packages/core-wasm/pkg
      - run: node scripts/check-wasm-size.mjs packages/core-wasm/pkg/dilla_core_wasm_bg.wasm
      - run: npm ci
      - run: npm run typecheck -w @dilla/media
      - run: npm run typecheck -w @dilla/core-wasm
      - run: npm run test:wasm -w @dilla/media
      - run: npm run check:schema -w @dilla/media

  rust-native:
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # The lint and test steps need the core area; the job itself runs for any code, because go-harness and the
      # browser suites download the testkit binary built below.
      - if: needs.changes.outputs.core != 'false'
        run: cargo fmt --all --check
      - if: needs.changes.outputs.core != 'false'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # SQLCipher's enhanced memory security calls mlock for SQLite allocations.
      - if: needs.changes.outputs.core != 'false'
        run: |
          sudo prlimit --pid "$$" --memlock=268435456:268435456
          cargo test --workspace --all-features --locked
      - run: cargo build -p dilla-testkit --release --locked
      - run: cargo build -p dilla-bot-core --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-bot-core
          path: target/release/dilla-bot-core
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-testkit
          path: target/release/dilla-testkit
          if-no-files-found: error

  rust-wasi:
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo build -p dilla-core-wasi --target wasm32-wasip1 --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-core-wasi
          path: target/wasm32-wasip1/release/dilla_core_wasi.wasm
          if-no-files-found: error

  browser-spike:
    name: encrypted-store-integration
    needs: [changes]
    if: needs.changes.outputs.e2e != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The wasm C build (sqlite-wasm-rs compiles SQLite3MC through cc) uses the dev box's LLVM 23.1 line:
    # the runner's own clang emits about 25 KB more wasm, so the D5 budget would not mean the same bytes here.
    env:
      CC_wasm32_unknown_unknown: /usr/bin/clang-23
      AR_wasm32_unknown_unknown: /usr/bin/llvm-ar-23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: clang23-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/llvm-23-debs
          key: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-latest
          restore-keys: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-
      - id: clang23
        name: clang 23 for the wasm C build
        run: bash scripts/ci-llvm.sh install
      - if: steps.clang23.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/llvm-23-debs
          key: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-${{ steps.clang23.outputs.build }}
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: bash scripts/install-ci-tool.sh wasm-bindgen
      - run: bash scripts/install-ci-tool.sh wasm-pack
      - run: bash scripts/install-ci-tool.sh binaryen
      - run: wasm-pack build core/dilla-core-wasm --target web --profile wasm-release --mode no-install --out-dir spike/pkg
      - run: npm ci
      # The shared encrypted-store harness runs only the Electron-compatible engine.
      - id: apt-browser-spike-key
        run: echo "suffix=$(bash scripts/ci-apt-cache.sh key)" >> "$GITHUB_OUTPUT"
      - id: apt-browser-spike
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: apt-debs-${{ runner.arch }}-${{ steps.apt-browser-spike-key.outputs.suffix }}-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            apt-debs-${{ runner.arch }}-${{ steps.apt-browser-spike-key.outputs.suffix }}-chromium-
            apt-debs-${{ runner.arch }}-${{ steps.apt-browser-spike-key.outputs.suffix }}-
      - run: bash scripts/ci-apt-cache.sh prepare
      - name: playwright install (chromium)
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium
      - run: bash scripts/ci-apt-cache.sh stash
      - if: steps.apt-browser-spike.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: ${{ steps.apt-browser-spike.outputs.cache-primary-key }}
      # Only the matrix script: it already runs the chromium project, so adding `test:e2e` here would
      # execute the 10-hand-over test twice per run and rewrite opfs-leader-metrics.json for nothing.
      - run: npm run test:e2e:matrix -w @dilla/e2e

  browser-media:
    name: media-protocol-integration
    needs: [changes, rust-native, rust-wasi]
    if: needs.changes.outputs.e2e != 'false'
    runs-on: ubuntu-24.04
    # SP-27's cold container run was unavailable; the controller retains the 25-minute budget.
    timeout-minutes: 25
    # The wasm C build (sqlite-wasm-rs compiles SQLite3MC through cc) uses clang 23, the dev box's major:
    # the runner's own clang emits about 25 KB more wasm, so the D5 budget would not mean the same bytes here.
    env:
      CC_wasm32_unknown_unknown: /usr/bin/clang-23
      AR_wasm32_unknown_unknown: /usr/bin/llvm-ar-23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: clang23-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/llvm-23-debs
          key: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-latest
          restore-keys: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-
      - id: clang23
        name: clang 23 for the wasm C build
        run: bash scripts/ci-llvm.sh install
      - if: steps.clang23.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/llvm-23-debs
          key: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-${{ steps.clang23.outputs.build }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Download Go modules (retried only on known network errors)
        run: node scripts/retry-on.mjs --pattern 'proxy\.golang\.org[^\n]*:\s(50[0-4]|429)\b|stream error|INTERNAL_ERROR|TLS handshake timeout|connection reset|i/o timeout' -- go mod download
      - run: bash scripts/install-ci-tool.sh wasm-bindgen
      - run: bash scripts/install-ci-tool.sh wasm-pack
      - run: bash scripts/install-ci-tool.sh binaryen
      - name: Fetch the wasm32-wasip1 core built by the rust-wasi job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-wasi
          path: internal/mlswasi/testdata
      - name: Fetch the testkit binary built by the rust-native job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-testkit
          path: artifacts
      - run: chmod +x artifacts/dilla-testkit
      - run: wasm-pack build core/dilla-core-wasm --target web --profile wasm-release --mode no-install --out-dir ../../packages/media/wasm
      - run: go build -o target/dilla-mediabot ./cmd/dilla-mediabot
      - run: npm ci
      - run: node packages/media/scripts/extract-rnnoise-wasm.mjs
      - id: apt-browser-media-key
        run: echo "suffix=$(bash scripts/ci-apt-cache.sh key)" >> "$GITHUB_OUTPUT"
      - id: apt-browser-media
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: apt-debs-${{ runner.arch }}-${{ steps.apt-browser-media-key.outputs.suffix }}-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            apt-debs-${{ runner.arch }}-${{ steps.apt-browser-media-key.outputs.suffix }}-chromium-
            apt-debs-${{ runner.arch }}-${{ steps.apt-browser-media-key.outputs.suffix }}-
      - run: bash scripts/ci-apt-cache.sh prepare
      - name: playwright install (chromium)
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium
      - run: bash scripts/ci-apt-cache.sh stash
      - if: steps.apt-browser-media.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: ${{ steps.apt-browser-media.outputs.cache-primary-key }}
      # The voice join fixture's own unit tests (e2e/ux/voice-fixture.mjs) drive a real page, so they run here,
      # where Chromium is installed; the node job has no Playwright browsers.
      - run: npm run test:voice-fixture -w @dilla/e2e
      - run: sh scripts/ci-audio-server.sh
      - run: npm run test:e2e:media -w @dilla/e2e
        env:
          DILLA_TESTKIT: ${{ github.workspace }}/artifacts/dilla-testkit
      - name: AV1 offered through the real SFU fails closed
        run: npx playwright test --config e2e/playwright.media.config.ts --project=chromium-media unsupported-sfu-codec.spec.ts
        env:
          DILLA_MEDIA_SFU_AV1: '1'
          DILLA_TESTKIT: ${{ github.workspace }}/artifacts/dilla-testkit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() && hashFiles('e2e/test-results/**') != ''
        with:
          name: browser-media-results
          path: e2e/test-results
          if-no-files-found: error

  web-build:
    needs: [changes]
    if: needs.changes.outputs.e2e != 'false'
    runs-on: ubuntu-24.04
    # Build the bundled UI once for Electron, shared core integration and go-release, so every
    # consumer tests or ships the same bytes. The webdist test is web.New's manifest check over
    # packages/web/dist, where the build left it: nothing is copied into internal/web/dist (ruling 38).
    timeout-minutes: 15
    # The wasm C build (sqlite-wasm-rs compiles SQLite3MC through cc) uses clang 23, the dev box's major:
    # the runner's own clang emits about 25 KB more wasm, so the D5 budget would not mean the same bytes here.
    env:
      CC_wasm32_unknown_unknown: /usr/bin/clang-23
      AR_wasm32_unknown_unknown: /usr/bin/llvm-ar-23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: clang23-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/llvm-23-debs
          key: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-latest
          restore-keys: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-
      - id: clang23
        name: clang 23 for the wasm C build
        run: bash scripts/ci-llvm.sh install
      - if: steps.clang23.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/llvm-23-debs
          key: llvm-23-debs-${{ runner.arch }}-ubuntu-24.04-${{ steps.clang23.outputs.build }}
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Download Go modules (retried only on known network errors)
        run: node scripts/retry-on.mjs --pattern 'proxy\.golang\.org[^\n]*:\s(50[0-4]|429)\b|stream error|INTERNAL_ERROR|TLS handshake timeout|connection reset|i/o timeout' -- go mod download
      - run: bash scripts/install-ci-tool.sh wasm-bindgen
      - run: bash scripts/install-ci-tool.sh wasm-pack
      - run: bash scripts/install-ci-tool.sh binaryen
      - run: wasm-pack build core/dilla-core-wasm --target web --profile wasm-release --mode no-install --out-dir ../../packages/core-wasm/pkg
      - run: node scripts/check-wasm-size.mjs packages/core-wasm/pkg/dilla_core_wasm_bg.wasm
      - run: npm ci
      - run: npm run typecheck -w @dilla/core-wasm
      - run: npm run typecheck -w @dilla/client-core
      - run: npm run typecheck -w @dilla/web
      - run: npm run typecheck:e2e
      - run: npm run build -w @dilla/web
      - run: npm run test:noise-release
      # The dist guard fails (never skips) on any data: URL in the built CSS or JS; it needs the build above.
      - run: npm run -w @dilla/web test:dist
      - run: npm run build:harness -w @dilla/client-core
      - run: go test -tags webdist ./internal/web/...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-web-dist
          path: packages/web/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-desktop-core
          path: packages/core-wasm/pkg/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-core-harness
          path: packages/client-core/harness-dist/
          if-no-files-found: error

  # Keep Linux sandbox security controls ahead of native desktop acceptance.
  linux-sandbox-foundation:
    needs: [changes]
    if: needs.changes.outputs.e2e != 'false'
    name: linux-sandbox-foundation-${{ matrix.lane }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-22.04, lane: namespace }
          - { os: ubuntu-24.04, lane: managed }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          sudo apt-get update
          case "$(lsb_release -rs)" in
            22.04) sudo apt-get install -y xvfb dbus-x11 libnss3 libgbm1 libgtk-3-0 libasound2 libfuse2 ;;
            24.04) sudo apt-get install -y xvfb dbus-x11 libnss3 libgbm1 libgtk-3-0t64 libasound2t64 libfuse2t64 ;;
            *) exit 1 ;;
          esac
      - run: npm ci
      - name: Read the Electron version
        id: electron-version
        shell: bash
        run: echo "version=$(node -p "require('electron/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron-version.outputs.version }}
      - name: Download the Electron binary (retried only on known network errors)
        run: node scripts/retry-on.mjs --pattern 'Response code (50[0-4]|429)\b|ETIMEDOUT|ECONNRESET|EAI_AGAIN|socket hang up' -- node node_modules/electron/install.js
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
      - name: Portable sandbox maintenance controls
        if: matrix.lane == 'managed'
        run: node --test packages/desktop/test/linux-sandbox-maintenance.test.mjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: matrix.lane == 'managed'
        with:
          go-version-file: go.mod
      - name: Download Go modules (retried only on known network errors)
        if: matrix.lane == 'managed'
        run: node scripts/retry-on.mjs --pattern 'proxy\.golang\.org[^\n]*:\s(50[0-4]|429)\b|stream error|INTERNAL_ERROR|TLS handshake timeout|connection reset|i/o timeout' -- go mod download
      - name: Root sandbox maintenance kernel proof
        id: sandbox_maintenance
        if: matrix.lane == 'managed'
        timeout-minutes: 8
        run: node --test packages/desktop/test/native/linux-sandbox-maintenance.test.mjs
        env:
          DILLA_LINUX_SANDBOX_FOUNDATION_LANE: managed
      - name: Cleanup root sandbox maintenance fixture
        if: always() && matrix.lane == 'managed' && contains(fromJSON('["success","failure","cancelled"]'), steps.sandbox_maintenance.outcome)
        timeout-minutes: 1
        run: node packages/desktop/test/native/linux-sandbox-maintenance.test.mjs --cleanup-only
        env:
          DILLA_LINUX_SANDBOX_FOUNDATION_LANE: managed
      - name: Preserve root sandbox maintenance proof
        if: always() && matrix.lane == 'managed' && contains(fromJSON('["success","failure","cancelled"]'), steps.sandbox_maintenance.outcome)
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-sandbox-maintenance-managed
          path: packages/desktop/test-results/linux-sandbox-maintenance-managed.json
          if-no-files-found: error
          retention-days: 3
      - id: sandbox_foundation
        run: xvfb-run -a dbus-run-session -- node --test packages/desktop/test/native/linux-sandbox-foundation.test.mjs
        env:
          DILLA_LINUX_SANDBOX_FOUNDATION_LANE: ${{ matrix.lane }}
      - if: always() && contains(fromJSON('["success","failure","cancelled"]'), steps.sandbox_foundation.outcome)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-sandbox-foundation-${{ matrix.lane }}
          path: packages/desktop/test-results/linux-sandbox-foundation-${{ matrix.lane }}.json
          if-no-files-found: error

  desktop:
    needs: [changes, web-build, rust-wasi, linux-sandbox-foundation]
    if: needs.changes.outputs.e2e != 'false'
    uses: ./.github/workflows/desktop.yml
    # The macOS Developer ID certificate and notarization key, read by its native job alone. Named, never
    # inherited (scripts/check-ci-workflow.mjs forbids inheriting), so no other secret reaches desktop.yml.
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  core-integration:
    needs: [changes, rust-native, rust-wasi, web-build]
    if: needs.changes.outputs.e2e != 'false'
    runs-on: ubuntu-latest
    # C18: the core-worker suite in Chromium, against the test host serving the build same-origin, with the native testkit peer.
    # The wasm arrives inside the two builds; no Rust toolchain here.
    # Budget: core took about 2 minutes plus about 3 of setup; 20 minutes leaves wide margin.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Download Go modules (retried only on known network errors)
        run: node scripts/retry-on.mjs --pattern 'proxy\.golang\.org[^\n]*:\s(50[0-4]|429)\b|stream error|INTERNAL_ERROR|TLS handshake timeout|connection reset|i/o timeout' -- go mod download
      - name: Fetch the wasm32-wasip1 core built by the rust-wasi job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-wasi
          path: internal/mlswasi/testdata
      - name: Fetch the testkit binary built by the rust-native job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-testkit
          path: artifacts
      - run: chmod +x artifacts/dilla-testkit
      - name: Fetch the web client built by the web-build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-web-dist
          path: packages/web/dist
      - name: Fetch the core-worker harness built by the web-build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-harness
          path: packages/client-core/harness-dist
      - run: npm ci
      - id: apt-core-integration-key
        run: echo "suffix=$(bash scripts/ci-apt-cache.sh key)" >> "$GITHUB_OUTPUT"
      - id: apt-core-integration
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: apt-debs-${{ runner.arch }}-${{ steps.apt-core-integration-key.outputs.suffix }}-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            apt-debs-${{ runner.arch }}-${{ steps.apt-core-integration-key.outputs.suffix }}-chromium-
            apt-debs-${{ runner.arch }}-${{ steps.apt-core-integration-key.outputs.suffix }}-
      - run: bash scripts/ci-apt-cache.sh prepare
      - name: playwright install (chromium)
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium
      - run: bash scripts/ci-apt-cache.sh stash
      - if: steps.apt-core-integration.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: ${{ steps.apt-core-integration.outputs.cache-primary-key }}
      - run: npm run test:e2e:core:chromium -w @dilla/e2e
        env:
          DILLA_TESTKIT: ${{ github.workspace }}/artifacts/dilla-testkit
      # upload-artifact v4+ refuses a second artifact of the same name in one run: one name per job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() && hashFiles('e2e/test-results/**') != ''
        with:
          name: browser-web-results-core-integration
          path: e2e/test-results
          if-no-files-found: error

  # A DAG barrier prevents the watcher exiting between root jobs and later matrix/reusable
  # children. This does no build work and never depends on the watcher or final aggregator.
  desktop-work-complete:
    needs: [changes, node, ui, rust-wasm-node, rust-native, rust-wasi, browser-spike, browser-media, web-build, linux-sandbox-foundation, desktop, core-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "All CI work reached a terminal result"

  # One check for the whole workflow: red on any failure/cancellation, green for success or intentional skips.
  desktop-ok:
    needs: [ci-watchdog, desktop-work-complete, changes, node, ui, rust-wasm-node, rust-native, rust-wasi, browser-spike, browser-media, web-build, linux-sandbox-foundation, desktop, core-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      # Fork PR tokens cannot cancel runs, so their watcher is deliberately skipped.
      - if: needs.ci-watchdog.result == 'skipped' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: exit 1
      - run: echo ok
