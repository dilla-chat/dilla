name: release
# A GitHub release for a v* tag: dillad, dillabot, its native helper for linux/amd64 and linux/arm64,
# the real web client embedded, the wasm32-wasip1 core, deploy/install.sh, deploy/install-bot.sh,
# the release-signed Android app dilla-<tag>.apk with its dilla-<tag>.apk.sha256, and SHA256SUMS over
# all assets. The two installers handle dillad and dillabot independently. No container image is built or pushed here.
#
# Releases in this repository are immutable: once gh release create publishes one, no asset can be
# added. So every asset, the APK included, is built here before the release job publishes, and a
# failed APK build fails the release (server and mobile releases move in lockstep). The iOS app goes
# to TestFlight from mobile-release.yml, which runs after this workflow and uploads nothing to the release.
#
# Each attached installer has the tag stamped into its release tag variable, so it installs this release by
# default: there is no "latest" (GitHub never serves a prerelease as latest, and every hyphenated tag
# is a prerelease here).
#
# Only a tag on a commit of main is released: main is what server.yml gates, and the tag job below
# refuses a commit without a green server run on main. Workflow actions are
# GitHub-owned and pinned to commits; other tool archives have checked-in SHA-256 pins. No job
# restores a build cache, because the release job publishes what install.sh runs as root.
#
# workflow_dispatch builds the release for an existing tag that has none yet (say, after a failed
# run): choose the tag itself as the ref in "Use workflow from" and type the same tag; the tag job
# refuses a mismatch. A release that already exists is refused; delete it first to rebuild it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: the existing tag to release, e.g. v0.1.0 (run the workflow from that tag)
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  tag:
    runs-on: ubuntu-latest
    # actions: read lists the server workflow's runs for the gate step; a job-level block replaces the workflow's, so contents repeats.
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      version: ${{ steps.tag.outputs.version }}
      noise_mode: ${{ steps.tag.outputs.noise_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: The release tag is the ref the workflow runs on, on a commit of main
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "release tags look like v1.2.3, got: $tag"; exit 1 ;;
          esac
          case "$tag" in
            *[!A-Za-z0-9.+_-]*) echo "the tag holds a character a release tag must not: $tag"; exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/tags/$tag" || { echo "run the workflow from the tag $tag itself, not from $GITHUB_REF"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$tag points at $GITHUB_SHA, which is not on main; only main, which server.yml gates, is released"; exit 1; }
          case "$tag" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "noise_mode=$(node scripts/release-noise-mode.mjs "$tag")" >> "$GITHUB_OUTPUT"
      - name: The tagged commit has a green server run on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ github.sha }}
        run: node scripts/server-release-gate.mjs "$TAG_SHA"

  web-build:
    runs-on: ubuntu-24.04
    needs: [tag]
    timeout-minutes: 15
    # The same build as server.yml's web-build, LLVM 23.1 pin included: the dist is what the binaries embed.
    env:
      CC_wasm32_unknown_unknown: /usr/bin/clang-23
      AR_wasm32_unknown_unknown: /usr/bin/llvm-ar-23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: clang23
        name: clang 23 for the wasm C build
        run: bash scripts/ci-llvm.sh install
      - run: rustup show active-toolchain
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download Go modules (retried only on known network errors)
        run: node scripts/retry-on.mjs --pattern 'proxy\.golang\.org[^\n]*:\s(50[0-4]|429)\b|stream error|INTERNAL_ERROR|TLS handshake timeout|connection reset|i/o timeout' -- go mod download
      - run: bash scripts/install-ci-tool.sh wasm-bindgen
      - run: bash scripts/install-ci-tool.sh wasm-pack
      - run: bash scripts/install-ci-tool.sh binaryen
      - run: wasm-pack build core/dilla-core-wasm --target web --profile wasm-release --mode no-install --out-dir ../../packages/core-wasm/pkg
      - run: node scripts/check-wasm-size.mjs packages/core-wasm/pkg/dilla_core_wasm_bg.wasm
      - run: npm ci
      - run: npm run typecheck -w @dilla/core-wasm
      - run: npm run typecheck -w @dilla/client-core
      - run: npm run typecheck -w @dilla/web
      - run: npm run build -w @dilla/web
        env:
          DILLA_NOISE_MODE: ${{ needs.tag.outputs.noise_mode }}
      - run: npm run test:noise-release
      - run: go test -tags webdist ./internal/web/...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-web-dist
          path: packages/web/dist/
          if-no-files-found: error

  rust-wasi:
    runs-on: ubuntu-latest
    needs: [tag]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show active-toolchain
      - run: cargo build -p dilla-core-wasi --target wasm32-wasip1 --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-core-wasi
          path: target/wasm32-wasip1/release/dilla_core_wasi.wasm
          if-no-files-found: error

  bot-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: [tag, rust-wasi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch the WASI core used by Bot identity tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-wasi
          path: internal/mlswasi/testdata
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download Go modules (retried only on known network errors)
        run: node scripts/retry-on.mjs --pattern 'proxy\.golang\.org[^\n]*:\s(50[0-4]|429)\b|stream error|INTERNAL_ERROR|TLS handshake timeout|connection reset|i/o timeout' -- go mod download
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: |
          # Match the Bot service's memory-lock allowance for SQLCipher tests.
          sudo prlimit --pid "$$" --memlock=268435456:268435456
          cargo test -p dilla-bot-core --locked
      - run: cargo build -p dilla-bot-core --release --locked
      - run: go test ./internal/bot/... ./cmd/dillabot
      - name: Build the architecture-matched Bot binary with the release version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" -o dist/dillabot-linux-${{ matrix.arch }} ./cmd/dillabot
      - name: The Bot binary carries the release version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: test "$(dist/dillabot-linux-${{ matrix.arch }} version)" = "dillabot $VERSION"
      - run: install -m 0755 target/release/dilla-bot-core dist/dilla-bot-core-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-bot-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  go-release:
    runs-on: ubuntu-latest
    needs: [tag, web-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download Go modules (retried only on known network errors)
        run: node scripts/retry-on.mjs --pattern 'proxy\.golang\.org[^\n]*:\s(50[0-4]|429)\b|stream error|INTERNAL_ERROR|TLS handshake timeout|connection reset|i/o timeout' -- go mod download
      - run: rm -rf internal/web/dist
      - name: Fetch the web client built by the web-build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-web-dist
          path: internal/web/dist
      - name: The binaries embed the real client, not the placeholder
        run: |
          test -f internal/web/dist/index.html
          if grep -q 'content="placeholder"' internal/web/dist/index.html; then echo "internal/web/dist still holds the placeholder client"; exit 1; fi
      - name: the downloaded client passes the manifest check
        run: go test -tags webdist ./internal/web/...
        env:
          DILLA_WEB_DIST: ${{ github.workspace }}/internal/web/dist
      # The tag job's version (the tag, its leading v dropped) is the binary's version (cmd/dillad main.Version);
      # every other build keeps 0.0.0-dev. It reaches the shell only through env, and the tag job allows only
      # [A-Za-z0-9.+_-] in the tag, so it is one word in the flags.
      - name: linux/amd64
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" -o dist/dillad-linux-amd64 ./cmd/dillad
      - name: linux/arm64
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" -o dist/dillad-linux-arm64 ./cmd/dillad
      # The amd64 binary runs here and says its version. The arm64 one cannot run here, and -trimpath records no ldflags,
      # so it is built by the same flags (the checker holds both lines) and must hold the version's text.
      - name: The binaries carry the release's version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          test -n "$VERSION"
          test "$(dist/dillad-linux-amd64 version | cut -d' ' -f1-2)" = "dillad $VERSION"
          grep -qaF -- "$VERSION" dist/dillad-linux-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dillad-binaries
          path: dist/
          if-no-files-found: error

  # The mobile client (packages/mobile/dist) and the wasm core it bundles, as mobile.yml's mobile-core-wasm and
  # mobile-bundle jobs build them, in one job. No secrets here; android-release ships these bytes.
  mobile-bundle:
    runs-on: ubuntu-24.04
    needs: [tag]
    timeout-minutes: 25
    # The wasm C build (sqlite-wasm-rs compiles SQLite3MC through cc) uses clang 23, as mobile.yml does.
    env:
      CC_wasm32_unknown_unknown: /usr/bin/clang-23
      AR_wasm32_unknown_unknown: /usr/bin/llvm-ar-23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: clang23
        name: clang 23 for the wasm C build
        run: bash scripts/ci-llvm.sh install
      - run: rustup show active-toolchain
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: bash scripts/install-ci-tool.sh wasm-bindgen
      - run: bash scripts/install-ci-tool.sh wasm-pack
      - run: bash scripts/install-ci-tool.sh binaryen
      - run: wasm-pack build core/dilla-core-wasm --target web --profile wasm-release --mode no-install --out-dir ../../packages/core-wasm/pkg
      - run: node scripts/check-wasm-size.mjs packages/core-wasm/pkg/dilla_core_wasm_bg.wasm
      - run: npm ci
      - run: npm run build -w @dilla/mobile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-mobile-dist
          path: packages/mobile/dist/
          if-no-files-found: error

  # The release-signed APK: built unsigned, signed from the mobile-release environment's keystore, proven to be signed
  # by the pinned certificate and to trust system CAs only with no cleartext, and handed to the release job as an
  # artifact. The tag job's gate (a commit of main with a green server run) is the only way here: the environment's
  # deployment policy admits main and v* tags, and this workflow runs on the tag ref.
  android-release:
    runs-on: ubuntu-24.04
    needs: [tag, mobile-bundle]
    timeout-minutes: 40
    environment: mobile-release
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      # The Android versionCode: 1000 + run_number*10 + run_attempt of this workflow, which runs once per tag, so it
      # only grows across tags and reruns (its next run, 60, gives 1601, above the hand-built v0.1.0-mobile2's 1001). At
      # most 9 attempts per run: a 10th would reuse the next run's number. The iOS build number is mobile-release.yml's
      # own (TestFlight numbers are independent of the Android versionCode). The version name is the tag's version
      # without its -suffix (v0.1.0-mobile1 gives 0.1.0), as iOS's marketing version.
      - name: Build number
        id: build
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          if [ "$RUN_ATTEMPT" -gt 9 ]; then echo "::error::attempt $RUN_ATTEMPT: more than 9 attempts of one run would reuse the next run's build number; dispatch a new run for the tag"; exit 1; fi
          echo "number=$((1000 + RUN_NUMBER * 10 + RUN_ATTEMPT))" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
      - name: The signing secrets are set
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing or empty secrets in the mobile-release environment:$missing"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Fetch the mobile client built by the mobile-bundle job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-mobile-dist
          path: packages/mobile/dist
      # Gradle rejects JDKs newer than 21 (packages/mobile/README.md); the image carries 21 beside its default.
      - name: JDK 21 for Gradle
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - run: cd packages/mobile && npx cap sync android
      # The build runs third-party code (Gradle plugins, npm packages), so it never sees the key (defence in depth, not a
      # security boundary: a process an earlier step left running could still read it): it builds the release APK
      # unsigned, and the next step alone holds the keystore and its passwords, signs with apksigner and removes the file.
      - name: Build the release APK, unsigned (retried only on known network errors)
        env:
          DILLA_ANDROID_VERSION_CODE: ${{ steps.build.outputs.number }}
          DILLA_ANDROID_VERSION_NAME: ${{ steps.build.outputs.name }}
        run: node scripts/retry-on.mjs --pattern 'Could not (GET|HEAD) .{1,400}Received status code (50[0-4]|429)|Server returned HTTP response code. (50[0-4]|429)|Read timed out|Connect timed out|Connection reset|Remote host terminated the handshake|UnknownHostException|SocketTimeoutException' -- packages/mobile/android/gradlew -p packages/mobile/android --no-daemon assembleRelease
      # The keystore exists only during this step: the trap removes it on any exit, and the hosted runner is discarded
      # after the job (a release is fail-closed and runs no always-run cleanup step, so there is no separate backstop).
      - name: Sign the APK with the release key (the keystore exists only during this step)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # The alias is not a secret: as one, GitHub masked every "dilla" in the job log.
          KEY_ALIAS: dilla
        run: |
          umask 077
          ks="$RUNNER_TEMP/dilla-release.p12"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ks"
          test -s "$ks" || { echo "::error::ANDROID_KEYSTORE_B64 decodes to an empty file"; exit 1; }
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          out=packages/mobile/android/app/build/outputs/apk/release
          "$tools/zipalign" -P 16 -f 4 "$out/app-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$out/app-release.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/aligned.apk"
      - name: The APK is signed by the pinned release key
        run: npm run android:check-signer -w @dilla/mobile
      - name: The APK trusts system CAs only and allows no cleartext
        run: npm run android:check-release-signed -w @dilla/mobile
      - name: Name the APK for the release and write its checksum
        run: |
          mkdir -p dist
          cp packages/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/dilla-$TAG.apk"
          # sha256sum format with the bare filename, so `sha256sum -c` works where the two are downloaded.
          cd dist && sha256sum "dilla-$TAG.apk" > "dilla-$TAG.apk.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-android-apk
          path: dist/
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [tag, go-release, rust-wasi, bot-release, android-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dillad-binaries
          path: release
      - name: Fetch the wasi core
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-wasi
          path: release
      - name: Fetch the architecture-matched Bot services and native helpers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dilla-bot-*
          path: release
          merge-multiple: true
      - name: Fetch the release-signed APK and its checksum
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-android-apk
          path: release
      # The tag job allows only [A-Za-z0-9.+_-] in TAG, so dilla-$TAG.apk is one word unquoted.
      - name: Assets and SHA256SUMS
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          cp deploy/install.sh release/install.sh
          sed -i "s/^DILLA_RELEASE_TAG=\"\"$/DILLA_RELEASE_TAG=\"$TAG\"/" release/install.sh
          test "$(grep -c "^DILLA_RELEASE_TAG=\"$TAG\"$" release/install.sh)" -eq 1
          cp deploy/install-bot.sh release/install-bot.sh
          sed -i "s/^DILLA_BOT_RELEASE_TAG=\"\"$/DILLA_BOT_RELEASE_TAG=\"$TAG\"/" release/install-bot.sh
          test "$(grep -c "^DILLA_BOT_RELEASE_TAG=\"$TAG\"$" release/install-bot.sh)" -eq 1
          cd release
          for f in dillad-linux-amd64 dillad-linux-arm64 dillabot-linux-amd64 dillabot-linux-arm64 dilla-bot-core-linux-amd64 dilla-bot-core-linux-arm64 dilla_core_wasi.wasm install.sh install-bot.sh dilla-$TAG.apk dilla-$TAG.apk.sha256; do test -s "$f"; done
          test "$(ls | wc -l)" -eq 11
          # The APK's own checksum file still matches the APK the android-release job signed.
          sha256sum -c --strict dilla-$TAG.apk.sha256
          sha256sum dillad-linux-amd64 dillad-linux-arm64 dillabot-linux-amd64 dillabot-linux-arm64 dilla-bot-core-linux-amd64 dilla-bot-core-linux-arm64 dilla_core_wasi.wasm install.sh install-bot.sh dilla-$TAG.apk > SHA256SUMS
          sha256sum -c --strict SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists; delete it first to rebuild it"; exit 1; fi
          flags=""
          if [ "$PRERELEASE" = true ]; then flags="--prerelease"; fi
          notes=(--generate-notes)
          if [ -f "docs/deploy/releases/$TAG.md" ]; then notes=(--notes-file "docs/deploy/releases/$TAG.md"); fi
          gh release create "$TAG" --verify-tag --title "$TAG" "${notes[@]}" $flags \
            release/dillad-linux-amd64 release/dillad-linux-arm64 release/dillabot-linux-amd64 release/dillabot-linux-arm64 release/dilla-bot-core-linux-amd64 release/dilla-bot-core-linux-arm64 release/dilla_core_wasi.wasm release/install.sh release/install-bot.sh release/dilla-$TAG.apk release/dilla-$TAG.apk.sha256 release/SHA256SUMS
