name: gpui-proofs
# Manual runs of the GPUI proofs under experiments/gpui-*. Not part of CI. Each job prints the RESULT lines and uploads
# every image (beta.5 reference, GPUI render, diff, worst-region crops) as an artifact named after the OS.
on:
  workflow_dispatch:
    inputs:
      # One job per dispatch: the org has about five macOS runners, so a manual run never takes more than it needs.
      job:
        description: 'Which proof to run'
        type: choice
        default: pixel-proof
        options: [pixel-proof, mac-render-spike, mac-parity-measure]
permissions:
  contents: read
jobs:
  pixel-proof:
    name: pixel-proof-${{ matrix.label }}
    if: inputs.job == 'pixel-proof'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # The win leg is expected red and unverified: its cfg(windows) path was never compiled and windows-latest has no GPU.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: linux }
          - { os: windows-latest, label: win }
          - { os: macos-15, label: mac }
    defaults:
      run:
        shell: bash
        working-directory: experiments/gpui-pixel-proof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      # GPUI's Linux build needs the X11/Wayland/font development packages; the headless wgpu renderer needs a
      # Vulkan driver, and a GPU-less runner gets Mesa's software one (lavapipe).
      - name: Install the GPUI build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: >-
          node scripts/retry-on.mjs --attempts 6 --wait 60
          --pattern 'Temporary failure resolving|Could not resolve|Failed to fetch|Unable to fetch'
          -- bash scripts/ci-apt-install.sh
          clang libclang-dev pkg-config libssl-dev libdbus-1-dev libasound2-dev
          libfontconfig-dev libfreetype-dev libvulkan-dev libgbm-dev libdrm-dev libglib2.0-dev
          libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
          libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxext-dev libxdamage-dev
          libxfixes-dev libxcomposite-dev libxrandr-dev
          mesa-vulkan-drivers vulkan-tools
      - run: rustup show active-toolchain
      - run: cargo build --release --locked
      - run: npm install --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install${{ runner.os == 'Linux' && ' --with-deps' || '' }} chromium
      - name: Render, diff and print the numbers
        run: ./run-proof.sh ${{ matrix.label }} out/${{ matrix.label }}
      # Linux: the validated pair must pass the correct render and fail the three wrong ones (exit 1 otherwise).
      # Elsewhere: print the scan so a pair can be chosen; never fails.
      - name: Validate the tolerance
        run: |
          if [ "${{ matrix.label }}" = linux ]; then
            ./validate-tolerance.sh linux 64 0.5 | tee -a out/linux/results.txt
          else
            ./validate-tolerance.sh ${{ matrix.label }} 0 0 scan | tee -a out/${{ matrix.label }}/results.txt
          fi
      - name: Summary
        run: |
          {
            echo '### pixel proof, ${{ matrix.label }}'
            echo '```'
            cat out/${{ matrix.label }}/results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pixel-proof-${{ matrix.label }}
          path: experiments/gpui-pixel-proof/out/${{ matrix.label }}
          if-no-files-found: error
  # The macOS CI plan (docs/superpowers/plans/2026-11-16-gpui-macos-ci.md), Task 0, rendering part: the shipping debug
  # build opens its real, on-screen window on the runner's logged-in session; the window is found through CGWindowList,
  # shot with screencapture and read with Vision (experiments/gpui-mac-render/window-check.swift). A frame with glyphs in it
  # means AppKit, Metal and CoreText all draw on a hosted macos-15. Also the in-process (headless Metal) checks of Tasks 1
  # and 2, with their numbers.
  mac-render-spike:
    if: inputs.job == 'mac-render-spike'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free disk space (macOS)
        run: |
          df -h /
          keep="$(cd "$(xcode-select -p)/../.." && pwd -P)"  # the real app, also when Xcode.app is a link to it
          for app in /Applications/Xcode*.app; do
            if [ ! -L "$app" ] && [ "$(cd "$app" && pwd -P)" != "$keep" ]; then sudo rm -rf "$app"; fi
          done
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet "$HOME/.dotnet" "$HOME/Library/Developer/CoreSimulator/Caches"
          df -h /
      - run: rustup show active-toolchain
      # Restore only: desktop-gpui.yml's macOS leg saves it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-gpui-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: desktop-gpui-${{ runner.os }}-${{ runner.arch }}-
      - name: Session and graphics
        run: |
          launchctl print "gui/$(id -u)" | head -n 15
          system_profiler SPDisplaysDataType
      - name: Glyphs and the traffic lights, headless (Tasks 1 and 2)
        run: cargo test -p dilla-parity --locked --test harness -- --nocapture text_draws_glyphs noop_text_system_draws_no_glyphs a_bar_without_the_inset_is_under_the_traffic_lights macos_header_clears_the_traffic_lights
      - name: Build the shipping debug binary
        run: cargo build -p dilla-desktop --locked
      - name: Open the real window, shoot it and read it
        run: |
          out="$RUNNER_TEMP/mac-render"
          mkdir -p "$out"
          check=experiments/gpui-mac-render/window-check.swift
          RUST_LOG=info target/debug/dilla-desktop > "$out/app.log" 2>&1 &
          pid=$!
          swift "$check" wait "$pid" 60 | tee "$out/windows.txt"
          sleep 3  # the compact start window grows to the sign-in shape
          swift "$check" wait "$pid" 5 | tee "$out/windows.txt"
          wid="$(awk '/^window /{print $2; exit}' "$out/windows.txt")"
          screencapture -x -o -l "$wid" "$out/window.png"
          screencapture -x "$out/screen.png"
          pgrep -l SecurityAgent && echo "::warning::a SecurityAgent (keychain prompt) is up" || echo "no SecurityAgent"
          swift "$check" look "$out/screen.png" | tee "$out/screen-ocr.txt" || true  # the whole screen: context only
          swift "$check" look "$out/window.png" | tee "$out/window-ocr.txt"
          kill "$pid"
          { echo '### mac render spike'; echo '```'; cat "$out/windows.txt" "$out/window-ocr.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: mac-render-spike
          path: ${{ runner.temp }}/mac-render
          if-no-files-found: error
  # Task 3 (decision D-A): every parity screen scored on macOS against the Linux web references, at the Linux deltas and
  # wider ones, plus the negative controls of the two shell fixtures (DILLA_PARITY_MEASURE prints a MEASURE line per frame
  # and skips the comparison). The [macos] limits in clients/desktop/parity/tolerance.toml are chosen from this run.
  mac-parity-measure:
    if: inputs.job == 'mac-parity-measure'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free disk space (macOS)
        run: |
          df -h /
          keep="$(cd "$(xcode-select -p)/../.." && pwd -P)"  # the real app, also when Xcode.app is a link to it
          for app in /Applications/Xcode*.app; do
            if [ ! -L "$app" ] && [ "$(cd "$app" && pwd -P)" != "$keep" ]; then sudo rm -rf "$app"; fi
          done
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet "$HOME/.dotnet" "$HOME/Library/Developer/CoreSimulator/Caches"
          df -h /
      - run: rustup show active-toolchain
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-gpui-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: desktop-gpui-${{ runner.os }}-${{ runner.arch }}-
      - name: Measure every parity screen and the controls
        env:
          DILLA_PARITY_MEASURE: '1'
        run: |
          set -o pipefail
          cargo test -p dilla-parity -p dilla-desktop --features dilla-desktop/automation --locked --no-fail-fast parity_ -- --include-ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/measure.txt"
      # The inline video player through Metal (the addendum's video row): its own loose bounds, printed per frame.
      - name: The video player's shots
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test -p dilla-desktop --features automation --locked --test video_player_shot -- --include-ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/video.txt"
          mkdir -p target/screen-parity
          cp target/parity-video/*.png target/screen-parity/
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          mkdir -p target/screen-parity
          grep -E '^MEASURE |^test .*(FAILED|ok)$' "$RUNNER_TEMP/measure.txt" > target/screen-parity/measure.txt || true
          grep -E '^video player |^test ' "$RUNNER_TEMP/video.txt" >> target/screen-parity/measure.txt || true
          { echo '### mac parity measure'; echo '```'; cat target/screen-parity/measure.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: mac-parity-measure
          path: target/screen-parity
          if-no-files-found: error
      # The nightly VideoToolbox check of desktop-gpui.yml, run once here to show its state: the decode test on the
      # `dilla-video-toolbox` build crashed (SIGSEGV) on macOS CI (core/vendor/README.md). Expected red until fixed.
      - name: Decode with VideoToolbox (known SIGSEGV)
        if: ${{ !cancelled() }}
        run: cargo test -p dilla-desktop --features webrtc-sys/dilla-video-toolbox --locked --lib -- --exact screens::attachments::video::tests::every_inline_format_decodes_its_frames_in_presentation_order
